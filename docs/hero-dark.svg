<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">zDash</title>
  <desc id="desc">Dark banner: zDash, a system dashboard with a ZFS superpower that costs nothing while you look away.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="0.55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#121d3c"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9d4f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2b3b63" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1200" cy="30" r="240" fill="url(#glowA)"/>
  <circle cx="40" cy="310" r="220" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="24" fill="none" stroke="#3b82f6" stroke-opacity="0.35"/>

  <rect x="80" y="60" width="352" height="30" rx="15" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/>
  <circle cx="100" cy="75" r="4" fill="#22d3ee"/>
  <text x="114" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#7dd3fc">SOCKET-ACTIVATED · ZERO IDLE COST</text>

  <path d="M110 112 L78 178 h26 L88 236 l44 -74 h-26 z" fill="url(#bolt)"/>

  <text x="152" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#wordmark)">zDash</text>

  <text x="82" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#cfe1fb">A general system dashboard with a ZFS superpower.</text>
  <text x="82" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8ba3c7">OS · CPU · memory · network · pools · vdevs · SMART · ARC — and it costs nothing while you look away.</text>

  <g>
    <rect x="660" y="50" width="540" height="220" rx="20" fill="#0b1428" fill-opacity="0.9" stroke="#31456e"/>
    <circle cx="686" cy="74" r="5" fill="#f87171"/>
    <circle cx="704" cy="74" r="5" fill="#fbbf24"/>
    <circle cx="722" cy="74" r="5" fill="#34d399"/>
    <text x="748" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6f88ad">zdash · live</text>
    <rect x="1118" y="64" width="58" height="20" rx="10" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.5"/>
    <circle cx="1130" cy="74" r="3.5" fill="#22c55e"/>
    <text x="1140" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#4ade80">ONLINE</text>

    <rect x="686" y="96" width="150" height="64" rx="12" fill="#12203c" stroke="#2a3c62"/>
    <text x="700" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2" fill="#7d92b5">CAPACITY</text>
    <circle cx="714" cy="138" r="13" fill="none" stroke="#243757" stroke-width="6"/>
    <circle cx="714" cy="138" r="13" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="58.8 81.7" transform="rotate(-90 714 138)"/>
    <text x="736" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf7">72%</text>
    <text x="736" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#7d92b5">1.4T / 2.0T</text>

    <rect x="848" y="96" width="150" height="64" rx="12" fill="#12203c" stroke="#2a3c62"/>
    <text x="862" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2" fill="#7d92b5">ARC HIT</text>
    <text x="862" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf7">98.2%</text>
    <rect x="862" y="138" width="120" height="6" rx="3" fill="#243757"/>
    <rect x="862" y="138" width="118" height="6" rx="3" fill="url(#accent)"/>
    <text x="862" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#7d92b5">12.4G cached</text>

    <rect x="1010" y="96" width="150" height="64" rx="12" fill="#12203c" stroke="#2a3c62"/>
    <text x="1024" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2" fill="#7d92b5">VDEVS</text>
    <text x="1024" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf7">4 + 1</text>
    <text x="1024" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#7d92b5">mirror · spare</text>
    <circle cx="1136" cy="146" r="4" fill="#22c55e"/>
    <circle cx="1124" cy="146" r="4" fill="#22c55e"/>
    <circle cx="1112" cy="146" r="4" fill="#fbbf24"/>

    <rect x="686" y="172" width="474" height="76" rx="12" fill="#12203c" stroke="#2a3c62"/>
    <text x="700" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2" fill="#7d92b5">HIT / MISS STREAM</text>
    <path d="M700 232 L718 222 L736 228 L754 210 L772 218 L790 202 L808 214 L826 196 L844 206 L862 190 L880 200 L898 188 L916 198 L934 182 L952 194 L970 188 L988 200 L1006 184 L1024 196 L1042 190 L1060 202 L1078 194 L1096 206 L1114 198 L1132 210 L1146 202" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M700 232 L718 222 L736 228 L754 210 L772 218 L790 202 L808 214 L826 196 L844 206 L862 190 L880 200 L898 188 L916 198 L934 182 L952 194 L970 188 L988 200 L1006 184 L1024 196 L1042 190 L1060 202 L1078 194 L1096 206 L1114 198 L1132 210 L1146 202 L1146 236 L700 236 Z" fill="url(#spark)"/>
  </g>
</svg>
