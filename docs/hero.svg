<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">pcscid terminal demo</title>
  <desc id="desc">A terminal shows a card scan producing a stable reader tag and btag, including a signed line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#11142e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#27e0a6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#27e0a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.8">
      <stop offset="0" stop-color="#6d7cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6d7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161c34"/>
      <stop offset="1" stop-color="#0d1226"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a3356"/>
      <stop offset="1" stop-color="#1a213d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .dim { fill: #7f8bb2; }
      .muted { fill: #9aa6cc; }
      .prompt { fill: #27e0a6; }
      .tag { fill: #8be9fd; }
      .btag { fill: #ffd166; }
      .sig { fill: #c792ea; }
      .ok { fill: #27e0a6; }
      .warn { fill: #ff8fa3; }
      .title { fill: #c9d2f2; font-size: 15px; }
      .line { font-size: 22px; }
      .small { font-size: 18px; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#glowA)"/>
  <rect width="1200" height="700" fill="url(#glowB)"/>

  <g filter="url(#shadow)">
    <rect x="86" y="64" width="1028" height="572" rx="18" fill="url(#term)" stroke="#2c3760" stroke-width="1.5"/>
    <rect x="86" y="64" width="1028" height="54" rx="18" fill="url(#bar)"/>
    <rect x="86" y="104" width="1028" height="14" fill="url(#bar)"/>
    <circle cx="122" cy="91" r="7" fill="#ff5f56"/>
    <circle cx="146" cy="91" r="7" fill="#ffbd2e"/>
    <circle cx="170" cy="91" r="7" fill="#27c93f"/>
    <text x="600" y="97" text-anchor="middle" class="mono title">pcscid · kiosk-07 · ACR122U</text>
  </g>

  <g class="mono">
    <text x="128" y="172" class="line prompt">$ ./pcscid</text>
    <text x="128" y="210" class="line dim">pcscid v0.0.170  ·  pure Go  ·  no cgo  ·  no libpcsclite</text>

    <text x="128" y="264" class="line muted">time=… level=INFO msg=</text><text x="363" y="264" class="line" fill="#a6e3a1">"reader identified"</text>
    <text x="160" y="296" class="small dim">reader=</text><text x="246" y="296" class="small" fill="#e6edf7">"ACS ACR122U 01 00 00"</text>
    <text x="512" y="296" class="small dim">model=</text><text x="588" y="296" class="small tag">qr-xlrk-i5</text>
    <text x="704" y="296" class="small dim">tag=</text><text x="760" y="296" class="small btag">be-4t2k-pm</text>
    <text x="880" y="296" class="small dim">tier=</text><text x="936" y="296" class="small ok">serial</text>

    <text x="128" y="364" class="line tag">#qr-xlrk-i5</text><text x="248" y="364" class="line dim">:</text><text x="262" y="364" class="line btag">r3v-401-5gmr</text>
    <text x="520" y="364" class="small dim">← MIFARE Classic 1K · UID 04 11 22 33</text>

    <text x="128" y="408" class="line tag">#be-4t2k-pm</text><text x="248" y="408" class="line dim">:</text><text x="262" y="408" class="line btag">6gh-6gn-fwep</text>
    <text x="520" y="408" class="small dim">← same card, a different reader, the same btag</text>

    <text x="128" y="452" class="line tag">#qr-xlrk-i5</text><text x="248" y="452" class="line dim">:</text><text x="262" y="452" class="line btag">w79-i3r-lmr0</text><text x="470" y="452" class="line sig">$U1NIU0lHAAAAAQAAA…</text>
    <text x="520" y="482" class="small dim">← signed line, verifiable with ssh-keygen -Y verify</text>

    <text x="128" y="550" class="small dim">card type + UID →</text>
    <text x="306" y="550" class="small" fill="#8be9fd">SHA-256("pcscid/v1|mifare classic 1k|04 11 22 33")</text>
    <text x="788" y="550" class="small dim">→</text>
    <text x="818" y="550" class="small btag">xxx-xxx-xxxx</text>
    <text x="128" y="584" class="small dim">same bytes everywhere. every reader. every machine. every reboot. forever.</text>
  </g>

  <text x="1100" y="664" text-anchor="end" class="mono small dim">github.com/paepckehh/pcscid</text>
</svg>
