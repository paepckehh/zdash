 <!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>zDash — ZFS Pool &amp; ARC Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap');

/* ════════════════════════════════════════════════════════════
   THEME: LIGHT — frosted glass over security-blue
   ════════════════════════════════════════════════════════════ */
:root,
:root[data-theme="light"] {
  color-scheme: light;
  --bg-0: #eef4fb;
  --bg-1: #e2ecf6;
  --grad-bg:
    radial-gradient(130% 100% at 12% -12%, rgba(14,165,233,0.16), transparent 55%),
    radial-gradient(110% 80% at 100% -10%, rgba(3,105,161,0.13), transparent 50%),
    radial-gradient(80% 60% at 85% 110%, rgba(22,163,74,0.08), transparent 55%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
  --grid-line: rgba(3,105,161,0.05);

  --glass: rgba(255,255,255,0.62);
  --glass-2: rgba(255,255,255,0.40);
  --glass-hover: rgba(255,255,255,0.82);
  --blur: 18px;
  --line: rgba(3,105,161,0.13);
  --line-strong: rgba(3,105,161,0.30);

  --text: #0b2e46;
  --muted: #456881;
  --dim: #6d8ba1;
  --on-accent: #ffffff;

  --phosphor: #0369a1;
  --phosphor-bright: #0c4a6e;
  --mint: #0d9668;
  --cyan: #0891b2;
  --crimson: #dc2626;
  --violet: #7c3aed;
  --amber-warn: #d97706;

  --c-green: #0d9668;
  --c-red: #e6425a;
  --c-amber: #e08a16;
  --c-cyan: #0891b2;
  --c-purple: #7c3aed;
  --c-amber-soft: #f0a639;

  --grad-accent: linear-gradient(135deg, #0369a1, #0ea5e9);
  --grad-ok: linear-gradient(135deg, #0d9668, #10b981);
  --grad-warn: linear-gradient(135deg, #d97706, #f59e0b);
  --grad-danger: linear-gradient(135deg, #dc2626, #ef4444);

  --glow: none;
  --glow-mint: none;
  --glow-crimson: none;

  --shadow: 0 1px 2px rgba(12,74,110,0.05), 0 10px 30px rgba(12,74,110,0.10);
  --shadow-lg: 0 2px 4px rgba(12,74,110,0.06), 0 20px 48px rgba(12,74,110,0.16);
  --tile-bg: rgba(3,105,161,0.05);
  --tile-hover: rgba(3,105,161,0.09);
  --bar-bg: rgba(3,105,161,0.10);
  --spark-bg: rgba(3,105,161,0.04);
  --disk-t1: rgba(3,105,161,0.10);
  --disk-t2: rgba(3,105,161,0.20);
  --disk-t3: rgba(3,105,161,0.32);

  --radius: 20px;
  --radius-sm: 13px;
  --radius-pill: 999px;
  --font-ui: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Fira Code', ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace;
  --transition: 0.25s cubic-bezier(0.22,1,0.36,1);
  --kpi-bg: var(--glass-2);
  --kpi-hover: var(--glass-hover);
  --kpi-border: var(--line);
  --badge-online-bg: rgba(13,150,104,0.12);
  --badge-degraded-bg: rgba(217,119,6,0.12);
  --badge-offline-bg: rgba(220,38,38,0.12);
  --tab-active-bg: rgba(255,255,255,0.7);
  --tab-indicator: var(--phosphor);
  --fab-bg: var(--glass);
  --ambient-blob-a: rgba(14,165,233,0.16);
  --ambient-blob-b: rgba(124,58,237,0.10);
  --ambient-blob-c: rgba(13,150,104,0.10);
  --scanline-opacity: 0;
}

/* ════════════════════════════════════════════════════════════
   THEME: DARK — deep space glass, cyan security glow
   ════════════════════════════════════════════════════════════ */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-0: #050a12;
  --bg-1: #081120;
  --grad-bg:
    radial-gradient(120% 90% at 15% -10%, rgba(14,165,233,0.13), transparent 55%),
    radial-gradient(100% 80% at 100% -10%, rgba(56,189,248,0.10), transparent 50%),
    radial-gradient(70% 55% at 80% 115%, rgba(124,58,237,0.10), transparent 55%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
  --grid-line: rgba(125,190,255,0.045);

  --glass: rgba(13,28,44,0.58);
  --glass-2: rgba(11,24,38,0.38);
  --glass-hover: rgba(22,44,66,0.70);
  --blur: 20px;
  --line: rgba(125,190,255,0.12);
  --line-strong: rgba(125,190,255,0.30);

  --text: #d9e9f6;
  --muted: #7d97ac;
  --dim: #4f6579;
  --on-accent: #05111d;

  --phosphor: #38bdf8;
  --phosphor-bright: #7dd3fc;
  --mint: #34d399;
  --cyan: #22d3ee;
  --crimson: #fb7185;
  --violet: #a78bfa;
  --amber-warn: #fbbf24;

  --c-green: #34d399;
  --c-red: #fb7185;
  --c-amber: #fbbf24;
  --c-cyan: #22d3ee;
  --c-purple: #a78bfa;
  --c-amber-soft: #fcd34d;

  --grad-accent: linear-gradient(135deg, #0ea5e9, #38bdf8);
  --grad-ok: linear-gradient(135deg, #10b981, #34d399);
  --grad-warn: linear-gradient(135deg, #f59e0b, #fbbf24);
  --grad-danger: linear-gradient(135deg, #ef4444, #fb7185);

  --glow: 0 0 12px rgba(56,189,248,0.28);
  --glow-mint: 0 0 12px rgba(52,211,153,0.28);
  --glow-crimson: 0 0 12px rgba(251,113,133,0.28);

  --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 12px 32px rgba(0,0,0,0.45);
  --shadow-lg: 0 2px 4px rgba(0,0,0,0.4), 0 24px 56px rgba(0,0,0,0.6);
  --tile-bg: rgba(125,190,255,0.05);
  --tile-hover: rgba(125,190,255,0.10);
  --bar-bg: rgba(125,190,255,0.09);
  --spark-bg: rgba(125,190,255,0.04);
  --disk-t1: rgba(56,189,248,0.10);
  --disk-t2: rgba(56,189,248,0.18);
  --disk-t3: rgba(56,189,248,0.30);

  --radius: 20px;
  --radius-sm: 13px;
  --radius-pill: 999px;
  --font-ui: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Fira Code', ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace;
  --transition: 0.25s cubic-bezier(0.22,1,0.36,1);
  --kpi-bg: var(--glass-2);
  --kpi-hover: var(--glass-hover);
  --kpi-border: var(--line);
  --badge-online-bg: rgba(52,211,153,0.12);
  --badge-degraded-bg: rgba(251,191,36,0.12);
  --badge-offline-bg: rgba(251,113,133,0.12);
  --tab-active-bg: rgba(56,189,248,0.12);
  --tab-indicator: var(--phosphor);
  --fab-bg: var(--glass);
  --ambient-blob-a: rgba(14,165,233,0.12);
  --ambient-blob-b: rgba(124,58,237,0.10);
  --ambient-blob-c: rgba(34,211,238,0.08);
  --scanline-opacity: 0.02;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html, body { background: var(--grad-bg); background-attachment: fixed; }
body {
  font-family: var(--font-ui);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.55;
  letter-spacing: 0.005em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  position: relative;
  overflow-x: hidden;
  padding-bottom: 110px;
}

/* subtle engineering grid overlay */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(90% 70% at 50% 0%, #000 30%, transparent 100%);
  mask-image: radial-gradient(90% 70% at 50% 0%, #000 30%, transparent 100%);
  opacity: var(--scanline-opacity);
}

/* ambient light blobs */
.blob { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
.blob-a { width: 560px; height: 560px; top: -180px; left: -140px; background: var(--ambient-blob-a); }
.blob-b { width: 440px; height: 440px; top: 20%; right: -160px; background: var(--ambient-blob-b); }
.blob-c { width: 520px; height: 520px; bottom: -220px; left: 30%; background: var(--ambient-blob-c); }

.wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 2; }

/* ── glass primitives ─────────────────────────────────────── */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
  backdrop-filter: blur(var(--blur)) saturate(150%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  transition: background var(--transition), border-color var(--transition),
    transform var(--transition), box-shadow var(--transition);
  position: relative;
}
.glass::before { /* top gloss highlight */
  content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  opacity: 0.6; pointer-events: none;
}
:root[data-theme="dark"] .glass::before {
  background: linear-gradient(90deg, transparent, rgba(125,190,255,0.22), transparent);
}
.glass-hover:hover {
  background: var(--glass-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: var(--line-strong);
}

/* ── navbar ────────────────────────────────────────────────── */
.navbar {
  display: flex; align-items: center; gap: 16px;
  position: sticky; top: 12px; z-index: 40;
  padding: 10px 16px; border-radius: var(--radius-pill);
  margin: 16px 0 30px;
}
.nav-brand {
  display: flex; align-items: baseline; gap: 4px;
  font-weight: 800; font-size: 1.25rem; letter-spacing: -0.02em;
  color: var(--phosphor-bright); white-space: nowrap;
}
.brand-host { font-weight: 600; font-size: 0.78rem; color: var(--muted); margin-left: 2px; }
.nav-links { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.nav-item {
  appearance: none; background: transparent; border: 1px solid transparent;
  color: var(--muted); font-family: var(--font-ui); font-size: 0.85rem; font-weight: 500;
  text-decoration: none; cursor: pointer; padding: 8px 14px; border-radius: var(--radius-pill);
  transition: all var(--transition); display: inline-flex; align-items: center; gap: 6px;
}
.nav-item:hover { color: var(--text); background: var(--tile-bg); border-color: var(--line); }
.nav-item.active { color: var(--on-accent); background: var(--grad-accent); border-color: transparent; box-shadow: var(--glow); }
.nav-right { display: flex; align-items: center; gap: 10px; }
.live {
  display: inline-flex; align-items: center; gap: 7px; color: var(--mint);
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em;
}
.live::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mint);
  box-shadow: var(--glow-mint); animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 0.45; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }
.theme-toggle {
  appearance: none; cursor: pointer;
  width: 40px; height: 40px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--glass-2); border: 1px solid var(--line); color: var(--phosphor-bright);
  transition: all var(--transition);
}
.theme-toggle:hover { background: var(--glass-hover); border-color: var(--line-strong); transform: translateY(-1px); box-shadow: var(--glow); }
.theme-toggle svg { width: 19px; height: 19px; display: block; }

/* ── dashboard shell ──────────────────────────────────────── */
.dash-head {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 14px; margin: 8px 0 22px;
}
.dash-title { display: flex; align-items: center; gap: 14px; }
.dash-title h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
.dash-meta { display: flex; align-items: center; gap: 14px; font-size: 0.78rem; color: var(--dim); }
.version-box, .v-box {
  font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600;
  color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 4px 10px; background: var(--glass-2);
}
.version-box .v-label { color: var(--dim); margin-right: 4px; }
.version-box .v-tag { color: var(--phosphor); }

/* KPI strip */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 26px; }
.kpi {
  background: var(--kpi-bg); border: 1px solid var(--kpi-border);
  border-radius: var(--radius-sm); padding: 18px 20px 22px; position: relative;
  overflow: hidden; transition: all var(--transition);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  backdrop-filter: blur(var(--blur)) saturate(140%);
}
.kpi::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--grad-accent); opacity: 0.75;
}
.kpi:hover { background: var(--kpi-hover); transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--line-strong); }
.kpi-label { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted); font-weight: 700; }
.kpi-value { font-size: 1.65rem; font-weight: 800; margin-top: 7px; font-variant-numeric: tabular-nums; color: var(--phosphor-bright); font-family: var(--font-mono); letter-spacing: -0.01em; }
.kpi[data-accent="hit"] .kpi-value { color: var(--mint); text-shadow: var(--glow-mint); }
.kpi[data-accent="miss"] .kpi-value { color: var(--crimson); text-shadow: var(--glow-crimson); }
.kpi[data-accent="size"] .kpi-value, .kpi[data-accent="arc"] .kpi-value { color: var(--cyan); }
.kpi-sub { font-size: 0.72rem; color: var(--dim); margin-top: 4px; }
.kpi-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--phosphor), var(--cyan)); width: 0; transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }
.kpi[data-accent="hit"] .kpi-bar { background: var(--grad-ok); }
.kpi[data-accent="miss"] .kpi-bar { background: var(--grad-danger); }
.kpi[data-accent="size"] .kpi-bar, .kpi[data-accent="arc"] .kpi-bar { background: linear-gradient(90deg, var(--cyan), var(--violet)); }

/* tabs */
.tabs { display: flex; gap: 8px; margin: 0 0 22px; width: 100%; overflow-x: auto; padding: 3px; position: relative; }
.tab {
  border: 1px solid var(--line); background: var(--glass-2); color: var(--muted); cursor: pointer;
  padding: 10px 20px 11px; font-family: var(--font-ui); font-size: 0.8rem; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap;
  border-radius: var(--radius-pill); transition: all var(--transition);
  display: inline-flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--text); background: var(--glass-hover); border-color: var(--line-strong); transform: translateY(-2px); }
.tab.active {
  color: var(--on-accent); background: var(--grad-accent);
  border-color: transparent; box-shadow: var(--glow);
}
.tab:focus-visible, .theme-toggle:focus-visible, .nav-item:focus-visible, .btn:focus-visible, .fab:focus-visible {
  outline: 2px solid var(--phosphor); outline-offset: 2px;
}
.pane { display: none; }
.pane.active { display: block; animation: pane-fade 0.4s ease; }
@keyframes pane-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* grid + cards */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
.card {
  background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
  backdrop-filter: blur(var(--blur)) saturate(150%);
  border-radius: var(--radius); padding: 22px 24px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
  transition: border-color var(--transition), background var(--transition),
    transform var(--transition), box-shadow var(--transition);
}
.card::before {
  content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  opacity: 0.55; pointer-events: none;
}
:root[data-theme="dark"] .card::before {
  background: linear-gradient(90deg, transparent, rgba(125,190,255,0.2), transparent);
}
.card:hover { border-color: var(--line-strong); background: var(--glass-hover); transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.card[data-accent="arc"] { border-top: 2px solid var(--cyan); }
.card[data-accent="pool"] { border-top: 2px solid var(--phosphor); }

.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; }
.card-title { font-size: 0.86rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--phosphor-bright); }

.badge {
  padding: 4px 11px; border-radius: var(--radius-pill); font-size: 0.66rem;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.13em;
  border: 1px solid transparent; white-space: nowrap; font-family: var(--font-mono);
}
.b-online { background: var(--badge-online-bg); color: var(--mint); border-color: rgba(13,150,104,0.3); }
.b-degraded { background: var(--badge-degraded-bg); color: var(--amber-warn); border-color: rgba(217,119,6,0.35); }
.b-offline { background: var(--badge-offline-bg); color: var(--crimson); border-color: rgba(220,38,38,0.35); }
:root[data-theme="dark"] .b-online, :root[data-theme="dark"] .b-degraded, :root[data-theme="dark"] .b-offline { border-color: var(--line-strong); }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.tile { background: var(--tile-bg); border: 1px solid var(--line); padding: 13px 10px; border-radius: var(--radius-sm); text-align: center; transition: background var(--transition), border-color var(--transition); }
.tile:hover { background: var(--tile-hover); border-color: var(--line-strong); }
.tile-label { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; font-family: var(--font-mono); }
.tile-value { font-size: 1.02rem; font-weight: 700; margin-top: 5px; color: var(--text); font-variant-numeric: tabular-nums; word-break: break-word; }
.tile-value.cyan { color: var(--cyan); }
.tile-value.mint { color: var(--mint); }
.tile-value.amber { color: var(--phosphor-bright); }
.tile-value.crimson { color: var(--crimson); }
.tile-value.violet { color: var(--violet); }

/* progress bars */
.bar-wrap { margin: 12px 0; }
.bar-head { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.09em; text-transform: uppercase; font-weight: 600; }
.bar-head span:last-child { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; text-transform: none; }
.bar { height: 10px; background: var(--bar-bg); border: 1px solid var(--line); border-radius: var(--radius-pill); overflow: hidden; position: relative; }
.bar-fill { height: 100%; background: var(--fill, var(--grad-accent)); border-radius: var(--radius-pill); transition: width 0.7s cubic-bezier(0.4,0,0.2,1); position: relative; }
.bar-fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent); animation: shimmer 3.2s infinite; }
@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

/* donut gauge */
.donut-row { display: flex; align-items: center; gap: 22px; }
.donut { position: relative; width: 132px; height: 132px; flex-shrink: 0; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.12)); }
.donut svg { transform: rotate(-90deg); }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.donut-pct { font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.donut-label { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700; }
.legend { flex: 1; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.leg-item { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--text); font-weight: 500; }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.leg-val { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text); font-family: var(--font-mono); font-size: 0.78rem; }

/* stacked ratio bar */
.ratio-bar-wrap { margin: 10px 0 4px; }
.ratio-bar-head { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
.ratio-bar-head span:last-child { color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; text-transform: none; }
.ratio-bar { height: 14px; background: var(--bar-bg); border: 1px solid var(--line); border-radius: var(--radius-pill); overflow: hidden; display: flex; min-width: 0; }
.ratio-bar-seg { height: 100%; transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }

/* sparkline */
.spark { height: 56px; margin: 10px 0 3px; position: relative; border: 1px solid var(--line); background: var(--spark-bg); border-radius: var(--radius-sm); }
.spark svg { width: 100%; height: 100%; display: block; }
.spark-axis { display: flex; justify-content: space-between; font-size: 0.58rem; color: var(--dim); letter-spacing: 0.1em; margin-top: 3px; font-family: var(--font-mono); }

/* pool capacity stat (compact variant) */
.cap-stat { display: flex; flex-direction: column; gap: 10px; padding: 14px 0 6px; }
.cap-stat-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.cap-stat-pct { font-size: 2.1rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--phosphor-bright); font-family: var(--font-mono); }
.cap-stat-pct.warn { color: var(--amber-warn); }
.cap-stat-pct.crit { color: var(--crimson); }
.cap-stat-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700; color: var(--muted); }
.cap-stat-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; }
.cap-stat-rows .sr { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); padding: 3px 0; border-bottom: 1px solid var(--line); }
.cap-stat-rows .sr span:last-child { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 0.76rem; }

/* spinning platter */
.platter-card { display: flex; flex-direction: column; }
.platter-stage { display: flex; align-items: center; gap: 22px; margin: 6px 0 16px; }
.platter { position: relative; width: 130px; height: 130px; flex-shrink: 0; cursor: pointer; }
.platter svg { display: block; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.18)); }
.platter .spin { transform-origin: 50% 50%; animation: spin-disk 16s linear infinite; }
.platter:hover .spin { animation-duration: 4s; }
.platter .head { transform-origin: 6% 50%; animation: head-seek 5.5s ease-in-out infinite; }
@keyframes spin-disk { to { transform: rotate(360deg); } }
@keyframes head-seek { 0%,100% { transform: rotate(-8deg); } 30% { transform: rotate(6deg); } 60% { transform: rotate(-2deg); } }
.platter-info { flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.platter-info .pi-row { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); }
.platter-info .pi-row span:last-child { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 0.76rem; }

/* vdev list */
.vdevs { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
.vdevs-title { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.18em; margin-bottom: 9px; font-weight: 700; font-family: var(--font-mono); }
.vdev {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 9px 12px; background: var(--tile-bg); border-left: 2px solid var(--line);
  margin-bottom: 6px; border-radius: var(--radius-sm); font-size: 0.78rem;
  transition: all var(--transition);
}
.vdev:hover { background: var(--tile-hover); border-left-color: var(--phosphor); transform: translateX(3px); }
.vdev-name { color: var(--phosphor-bright); font-size: 0.76rem; word-break: break-all; font-weight: 600; font-family: var(--font-mono); }
.vdev-info { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 0.7rem; flex-shrink: 0; }

/* loading / error */
.state { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 0.92rem; }
.spinner { width: 42px; height: 42px; margin: 0 auto 16px; position: relative; }
.spinner::before, .spinner::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--line); border-top-color: var(--phosphor);
  animation: spin 1s linear infinite;
}
.spinner::after { inset: 7px; border-top-color: var(--cyan); animation-direction: reverse; animation-duration: 1.4s; }
@keyframes spin { to { transform: rotate(360deg); } }
.err { color: var(--crimson); }
.err-detail { font-size: 0.78rem; opacity: 0.8; margin-top: 8px; color: var(--muted); font-family: var(--font-mono); }
.muted-note { font-size: 0.72rem; color: var(--dim); margin-top: 13px; text-align: center; }

/* fastfetch-style system summary */
.fastfetch { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
.fastfetch-logo {
  flex-shrink: 0; width: 124px; height: 124px; padding: 10px;
  background: var(--tile-bg); border: 1px solid var(--line);
  border-radius: var(--radius); position: relative;
  display: flex; align-items: center; justify-content: center;
}
.fastfetch-logo .distro-logo { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.18)); }
.fastfetch-rows { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.ff-title { font-size: 1.12rem; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 6px; color: var(--phosphor-bright); }
.ff-title .ff-host { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
.ff-row { display: flex; align-items: baseline; gap: 9px; font-size: 0.8rem; line-height: 1.45; }
.ff-key { color: var(--phosphor); font-weight: 600; min-width: 98px; flex-shrink: 0; font-size: 0.74rem; letter-spacing: 0.05em; font-family: var(--font-mono); }
.ff-sep { color: var(--dim); }
.ff-val { color: var(--text); font-size: 0.78rem; word-break: break-word; }
.ff-bar { flex: 1; max-width: 200px; margin-left: 4px; }
.ff-bar .bar { height: 6px; }
.ff-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 32px; }
.ff-col { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
@media (max-width: 720px) { .ff-cols { grid-template-columns: 1fr; gap: 0; } }

/* ARC live stream */
.stream-card { margin-bottom: 18px; }
.stream { display: flex; gap: 2px; height: 120px; align-items: flex-end; background: var(--spark-bg); border: 1px solid var(--line); padding: 8px; overflow: hidden; border-radius: var(--radius-sm); }
.stream-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-width: 4px; }
.stream-cell { width: 100%; border-radius: 2px; transition: height 0.45s cubic-bezier(0.4,0,0.2,1); }
.stream-cell.hit { background: var(--c-green); box-shadow: 0 0 6px var(--c-green); }
.stream-cell.miss { background: var(--c-red); box-shadow: 0 0 6px var(--c-red); }
.stream-rise-new { animation: stream-rise 0.5s ease; }
@keyframes stream-rise { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
.stream-legend { display: flex; gap: 18px; margin-top: 11px; font-size: 0.72rem; color: var(--muted); align-items: center; }
.stream-legend .lg { display: flex; align-items: center; gap: 7px; }
.stream-legend .lg::before { content: ""; width: 8px; height: 8px; border-radius: 2px; }
.stream-legend .lg.hit::before { background: var(--c-green); box-shadow: 0 0 5px var(--c-green); }
.stream-legend .lg.miss::before { background: var(--c-red); box-shadow: 0 0 5px var(--c-red); }

/* FAB */
.fab {
  position: fixed; bottom: 24px; right: 24px; z-index: 50;
  background: var(--fab-bg); color: var(--phosphor-bright);
  border: 1px solid var(--line-strong); width: 58px; height: 58px; border-radius: 50%;
  cursor: pointer; font-family: var(--font-mono); font-weight: 700; font-size: 0.72rem;
  -webkit-backdrop-filter: blur(var(--blur));
  backdrop-filter: blur(var(--blur));
  box-shadow: var(--shadow-lg); transition: all var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.fab svg { width: 21px; height: 21px; }
.fab:hover { background: var(--glass-hover); transform: translateY(-3px); box-shadow: var(--glow), var(--shadow-lg); }
.fab:active { transform: translateY(0); }
.fab .pulse { display: none; }
.fab.refreshing { animation: spin 0.9s linear infinite; }

/* matrix rain canvas (dark ambient, subtle) */
#matrix-rain { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
:root[data-theme="dark"] #matrix-rain { opacity: 0.05; }
:root[data-theme="light"] #matrix-rain { display: none; }

/* ── responsive ───────────────────────────────────────────── */
@media (max-width: 1024px) {
  .grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 12px; }
  .navbar { flex-wrap: wrap; border-radius: var(--radius); }
  .grid { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: 1fr; }
  .donut-row, .platter-stage { flex-direction: column; align-items: stretch; }
  .donut, .platter { align-self: center; }
  .fastfetch { flex-direction: column; align-items: stretch; }
  .fastfetch-logo { margin: 0 auto; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .platter .spin, .fab.refreshing { animation: none !important; }
  #matrix-rain { display: none !important; }
  .card:hover, .kpi:hover, .glass-hover:hover, .btn:hover { transform: none; }
}
</style>
</head>
<body>
<canvas id="matrix-rain"></canvas>
<div class="blob blob-a"></div>
<div class="blob blob-b"></div>
<div class="blob blob-c"></div>

<div class="wrap">
  <!-- ══════════════ NAVBAR ══════════════ -->
  <nav class="navbar glass">
    <div class="nav-brand">zDash<span class="brand-host" id="brand-host"></span></div>
    <div class="nav-right">
      <span class="live" id="nav-live">live</span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </nav>


  <!-- ══════════════ DASHBOARD ══════════════ -->
  <div id="view-dashboard">
    <header class="dash-head">
      <div class="dash-title">
        <h2>Real-time monitoring</h2>
        <span class="live">live</span>
      </div>
      <div class="dash-meta">
        <span id="dash-uptime">— uptime</span>
        <div class="version-box" title="zDash build version">
          <span class="v-label">zDash</span><span class="v-tag" id="version-tag">__ZDASH_VERSION__</span>
        </div>
      </div>
    </header>

    <div id="kpis" class="kpi-row"></div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="system" role="tab" type="button">system</button>
      <button class="tab" data-tab="pools" role="tab" type="button">pools</button>
      <button class="tab" data-tab="arc" role="tab" type="button">arc cache</button>
    </nav>

    <section id="pane-system" class="pane active">
      <div id="sys-grid" class="grid"></div>
      <div id="sys-state" class="state">
        <div class="spinner"></div>
        <div>booting system telemetry…</div>
      </div>
    </section>

    <section id="pane-pools" class="pane">
      <div id="pools-grid" class="grid"></div>
      <div id="pools-state" class="state">
        <div class="spinner"></div>
        <div>spinning up pools…</div>
      </div>
    </section>

    <section id="pane-arc" class="pane">
      <div class="card stream-card" data-accent="arc" id="arc-stream">
        <div class="card-head">
          <span class="card-title">live traffic</span>
          <span class="badge b-online" id="arc-stream-badge">— hit</span>
        </div>
        <div class="stream"></div>
        <div class="stream-legend">
          <span class="lg hit">hits / interval</span>
          <span class="lg miss">misses / interval</span>
          <span id="arc-stream-count" style="margin-left:auto;color:var(--dim)">0 samples</span>
        </div>
      </div>
      <div id="arc-grid" class="grid"></div>
      <div id="arc-state" class="state">
        <div class="spinner"></div>
        <div>reading arc kstat…</div>
      </div>
    </section>
  </div>
</div>

<button class="fab" id="fab" onclick="refreshAll()" aria-label="Refresh now" title="Refresh now">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
</button>

<script>
  /* ── theme switcher (light default, dark ambient) ────────── */
  const THEME_KEY = 'zdash-theme';
  const ICON_SUN = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
  const ICON_MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  const root = document.documentElement;
  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    const icon = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (icon) icon.innerHTML = theme === 'dark' ? ICON_SUN : ICON_MOON;
    if (label) label.textContent = theme === 'dark' ? 'light' : 'dark';
  }
  function isLight() { return root.getAttribute('data-theme') !== 'dark'; }
  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) { /* ignore */ }
    applyTheme(saved === 'dark' ? 'dark' : 'light');
  })();
  let lastRefresh = 0;
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
        if (Date.now() - lastRefresh > 800) refreshAll();
      });
    }
  });

  /* ── matrix rain (dark theme ambient, subtle) ────────────── */
  const matrixCanvas = document.getElementById('matrix-rain');
  let matrixRAF = null;
  function startMatrixRain() {
    if (!matrixCanvas) return;
    const ctx = matrixCanvas.getContext('2d');
    const resize = () => {
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener('resize', resize);
    const glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEFｱｲｳｴｵｶｷｸ<>/\\|*=$#@';
    const fontSize = 14;
    let columns = Math.floor(matrixCanvas.width / fontSize);
    let drops = new Array(columns).fill(1).map(() => Math.random() * -matrixCanvas.height);
    function draw() {
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
      ctx.fillStyle = '#38bdf8';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const ch = glyphs[Math.floor(Math.random() * glyphs.length)];
        ctx.fillText(ch, i * fontSize, drops[i]);
        drops[i] += fontSize;
        if (drops[i] > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
      }
    }
    function loop() {
      if (root.getAttribute('data-theme') !== 'dark') { matrixRAF = null; return; }
      draw();
      matrixRAF = requestAnimationFrame(loop);
    }
    if (matrixRAF) cancelAnimationFrame(matrixRAF);
    loop();
  }
  document.addEventListener('DOMContentLoaded', () => {
    if (root.getAttribute('data-theme') === 'dark' &&
      !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      startMatrixRain();
    }
    const btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.addEventListener('click', () => {
        if (root.getAttribute('data-theme') === 'dark' && !matrixRAF &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          startMatrixRain();
        }
      });
    }
  });

  const REFRESH_MS = 5000;
  let timer = null;
  let activeTab = 'system';
  const caps = { zfs: true, arc: true, smart: false };
  const hitHistory = [];
  const missHistory = [];
  const sizeHistory = [];
  const HIST_LEN = 60;

  // Live ARC traffic stream: array of buckets, each {h, m} deltas.
  let prevHits = null, prevMisses = null;
  const streamBuckets = [];
  const STREAM_LEN = 48;
  let streamCols = null;      // cached .stream-col elements (STREAM_LEN)
  let streamScaleRef = 1;     // smoothed max for stable bar heights

  /* ── capability-driven tab suppression ──────────────────── */
  function applyCaps(c) {
    caps.zfs = !!(c && c.zfs_available);
    caps.arc = !!(c && c.arc_available);
    const poolTab = document.querySelector('.tab[data-tab="pools"]');
    const arcTab = document.querySelector('.tab[data-tab="arc"]');
    const poolPane = document.getElementById('pane-pools');
    const arcPane = document.getElementById('pane-arc');
    if (poolTab) poolTab.hidden = !caps.zfs;
    if (arcTab) arcTab.hidden = !caps.arc;
    if (poolPane) poolPane.hidden = !caps.zfs;
    if (arcPane) arcPane.hidden = !caps.arc;
    if ((!caps.zfs && activeTab === 'pools') ||
        (!caps.arc && activeTab === 'arc')) {
      document.querySelector('.tab[data-tab="system"]').click();
    }
  }

  /* ── helpers ─────────────────────────────────────────────── */
  function healthBadge(state) {
    const s = (state || '').toUpperCase();
    if (s === 'ONLINE') return 'b-online';
    if (s === 'DEGRADED') return 'b-degraded';
    if (s === 'OFFLINE' || s === 'FAULTED') return 'b-offline';
    return 'b-online';
  }

  function fmtBytes(b) {
    if (b == null || isNaN(b)) return '—';
    const u = ['B','KiB','MiB','GiB','TiB','PiB','EiB'];
    let i = 0, v = Number(b);
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return v.toFixed(v < 10 && i > 0 ? 2 : 1) + ' ' + u[i];
  }

  function fmtNum(n) {
    if (n == null || isNaN(n)) return '—';
    if (n < 1000) return String(n);
    if (n < 1e6) return (n/1e3).toFixed(1) + 'K';
    if (n < 1e9) return (n/1e6).toFixed(2) + 'M';
    if (n < 1e12) return (n/1e9).toFixed(2) + 'B';
    return (n/1e12).toFixed(2) + 'T';
  }

  function pct(n, d) { return d ? Math.min((n / d) * 100, 100) : 0; }

  function escapeHTML(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* donut: returns SVG markup for a glass donut */
  function donutSVG(segments, size = 132, stroke = 14) {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const cx = size / 2;
    let offset = 0;
    let paths = '';
    for (const seg of segments) {
      if (seg.value <= 0) continue;
      const len = (seg.value / 100) * c;
      paths += `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none"
        stroke-width="${stroke}"
        style="stroke:${seg.color}"
        stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-offset}"
        stroke-linecap="butt"/>`;
      offset += len;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
  }

  function sparkline(data, color, height = 54) {
    if (!data.length) return '<svg viewBox="0 0 100 ' + height + '"></svg>';
    const max = Math.max(...data, 1);
    const min = Math.min(...data, 0);
    const range = max - min || 1;
    const w = 100;
    const step = data.length > 1 ? w / (data.length - 1) : w;
    const pts = data.map((v, i) => {
      const x = i * step;
      const y = height - ((v - min) / range) * (height - 8) - 4;
      return `${x.toFixed(2)},${y.toFixed(2)}`;
    }).join(' ');
    const areaPts = `0,${height} ${pts} ${w},${height}`;
    const gid = 'g' + Math.random().toString(36).slice(2, 8);
    return `
      <svg viewBox="0 0 100 ${height}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" style="stop-color:${color};stop-opacity:0.4"/>
            <stop offset="100%" style="stop-color:${color};stop-opacity:0"/>
          </linearGradient>
        </defs>
        <polygon points="${areaPts}" fill="url(#${gid})"/>
        <polyline points="${pts}" fill="none" style="stroke:${color};stroke-width:1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>`;
  }

  /* ── signature: spinning disk platter ────────────────────── */
  function platterSVG(capPct, healthState) {
    const size = 130;
    const cx = size / 2;
    const stroke = 8;
    const r = (size - stroke) / 2 - 2;
    const c = 2 * Math.PI * r;
    const fillLen = (Math.min(capPct, 100) / 100) * c;
    const capColor = capPct > 90 ? 'var(--c-red)' : capPct > 75 ? 'var(--c-amber)' : 'var(--c-amber-soft)';
    // concentric tracks
    let tracks = '';
    for (let i = 1; i <= 4; i++) {
      const tr = r - (i * 8);
      if (tr < 8) break;
      tracks += `<circle cx="${cx}" cy="${cx}" r="${tr}" fill="none" style="stroke:var(--disk-t1)" stroke-width="0.6"/>`;
    }
    // sector ticks
    let ticks = '';
    for (let a = 0; a < 360; a += 30) {
      const rad = (a - 90) * Math.PI / 180;
      const x1 = cx + Math.cos(rad) * (r - 2);
      const y1 = cx + Math.sin(rad) * (r - 2);
      const x2 = cx + Math.cos(rad) * (r - 6);
      const y2 = cx + Math.sin(rad) * (r - 6);
      ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--disk-t2)" stroke-width="0.7"/>`;
    }
    return `
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <defs>
          <radialGradient id="pl-grad-${capPct|0}" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="var(--c-amber-soft)" stop-opacity="0.06"/>
            <stop offset="70%" stop-color="var(--c-amber-soft)" stop-opacity="0.02"/>
            <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="${cx}" cy="${cx}" r="${r + 2}" fill="url(#pl-grad-${capPct|0})" style="stroke:var(--disk-t3)" stroke-width="1"/>
        <g class="spin">
          ${tracks}
          ${ticks}
          <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" style="stroke:var(--disk-t2)" stroke-width="0.6" stroke-dasharray="2 4"/>
          <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke-width="${stroke}"
            style="stroke:${capColor};stroke-dasharray:${fillLen} ${c - fillLen};filter:drop-shadow(0 0 5px ${capColor})"/>
          <circle cx="${cx}" cy="${cx}" r="${r - 14}" fill="none" stroke-width="2"
            stroke-dasharray="${fillLen * 0.6} ${c * 0.6}" stroke-dashoffset="0" opacity="0.5"
            style="stroke:${capColor}"/>
        </g>
        <circle cx="${cx}" cy="${cx}" r="6" fill="${capColor}" style="filter: drop-shadow(0 0 4px ${capColor});"/>
        <circle cx="${cx}" cy="${cx}" r="2" fill="var(--bg-0)"/>
        <g class="head">
          <line x1="${cx - size * 0.42}" y1="${cx}" x2="${cx - 4}" y2="${cx}" stroke-width="2" opacity="0.7" style="stroke:${capColor}"/>
          <rect x="${cx - 8}" y="${cx - 3}" width="6" height="6" fill="${capColor}" opacity="0.85" style="filter: drop-shadow(0 0 3px ${capColor});"/>
        </g>
      </svg>`;
  }

  /* colors used across generated markup (theme-token based) */
  const C = {
    green: 'var(--c-green)',
    red: 'var(--c-red)',
    amber: 'var(--c-amber)',
    amberSoft: 'var(--c-amber-soft)',
    cyan: 'var(--c-cyan)',
    purple: 'var(--c-purple)'
  };

  /* ── tab switching (event delegation so dynamic SMART tabs work) ── */
  document.querySelector('.tabs').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.tab');
    if (!btn || btn.hidden) return;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    activeTab = btn.dataset.tab;
    const pane = document.getElementById('pane-' + activeTab);
    if (pane) pane.classList.add('active');
  });

  /* ── KPI summary strip + landing stats ───────────────────── */
  function renderKPIs(pools, arc) {
    const el = document.getElementById('kpis');
    const kpis = [];

    if (caps.zfs) {
      let poolCount = 0, onlineCount = 0, totalCap = 0, countCap = 0;
      if (pools && pools.pools) {
        poolCount = Object.keys(pools.pools).length;
        for (const p of Object.values(pools.pools)) {
          if ((p.state || '').toUpperCase() === 'ONLINE') onlineCount++;
          const cap = parseFloat(p.properties?.capacity?.value) || 0;
          totalCap += cap; countCap++;
        }
      }
      const avgCap = countCap ? (totalCap / countCap) : 0;
      kpis.push({ accent: 'pool', label: 'pools', value: poolCount || '—', sub: `${onlineCount} online`, bar: 100 });
      kpis.push({ accent: 'pool', label: 'avg capacity', value: poolCount ? avgCap.toFixed(1) + '%' : '—', sub: 'across all pools', bar: avgCap });
    }

    if (caps.arc && arc) {
      const total = arc.hits + arc.misses;
      const hitRatio = total ? (arc.hits / total * 100) : 0;
      kpis.push({ accent: 'hit', label: 'arc hit ratio', value: hitRatio.toFixed(2) + '%', sub: fmtNum(arc.hits) + ' hits', bar: hitRatio });
      kpis.push({ accent: 'miss', label: 'arc misses', value: fmtNum(arc.misses), sub: 'since load', bar: Math.min(arc.misses / (total || 1) * 100, 100) });
      kpis.push({ accent: 'size', label: 'arc size', value: fmtBytes(arc.size), sub: 'max ' + fmtBytes(arc.c_max), bar: arc.c_max ? (arc.size / arc.c_max * 100) : 0 });
      const used = arc.c_max ? (arc.size / arc.c_max * 100) : 0;
      kpis.push({ accent: 'arc', label: 'arc utilization', value: used.toFixed(1) + '%', sub: fmtBytes(arc.c) + ' target', bar: used });
    }

    el.innerHTML = kpis.map(k => `
      <div class="kpi" data-accent="${k.accent}">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${k.value}</div>
        <div class="kpi-sub">${k.sub}</div>
        <div class="kpi-bar" style="width:${Math.min(k.bar, 100).toFixed(1)}%"></div>
      </div>`).join('');
  }

  /* ── System overview (fastfetch-style) ────────────────────── */
  /* Returns an inline SVG distro mark: the NixOS snowflake when the host
     reports os_id === 'nixos', otherwise a generic Linux/Tux penguin. */
  function osLogoSVG(osId) {
    const id = (osId || '').toLowerCase();
    const stroke = 'var(--phosphor)';
    const accent = 'var(--phosphor-bright)';
    if (id === 'nixos') {
      // NixOS snowflake: six-fold symmetric lambda logo.
      return `
      <svg class="distro-logo nixos" viewBox="0 0 128 128" role="img" aria-label="NixOS">

        <g fill="url(#nix-grad)" fill-rule="evenodd">

    // Generic Tux-style penguin silhouette.
    return `
    <svg class="distro-logo tux" viewBox="0 0 128 128" role="img" aria-label="Linux">
      <defs>
        <linearGradient id="tux-body" x1="0" y1="0" x2="0" y2="1">

  /* Six rotated copies of the NixOS "λ"-shaped snowflake arm centered at 64,64.
     Built from two overlapping slanted bars per arm. */
  function nixosSnowflake() {
    const cx = 64, cy = 64;
    let arms = '';
    for (let i = 0; i < 6; i++) {
      const a = i * 60;
      arms += `<g transform="rotate(${a} ${cx} ${cy})">
        <rect x="60" y="18" width="8" height="46" rx="2"/>
        <rect x="60" y="18" width="8" height="46" rx="2" transform="rotate(120 64 64)"/>
      </g>`;
    }
    return arms;
  }

  async function fetchSysInfo() {

  /* ── Pool rendering with spinning platters ───────────────── */
  function renderVdevs(vdevs, depth = 0) {
    if (!vdevs) return '';
    let html = '';
    for (const [name, v] of Object.entries(vdevs)) {
      const indent = depth * 16;
      const hc = healthBadge(v.state);
      const size = v.properties?.size?.value || '—';
      const path = v.path || 'N/A';
      html += `
        <div class="vdev" style="margin-left:${indent}px">
          <span class="vdev-name">${escapeHTML(name)}</span>
          <div class="vdev-info">
            <span class="badge ${hc}">${escapeHTML(v.state)}</span>
            <span>${escapeHTML(size)}</span>
            <span style="font-size:0.66rem;opacity:0.65">${escapeHTML(path)}</span>
          </div>
        </div>`;
      if (v.vdevs) html += renderVdevs(v.vdevs, depth + 1);
    }
    return html;
  }

      ? `linear-gradient(90deg,${C.red},${C.purple})`

      <div class="card platter-card" data-accent="pool">

            <div class="pi-row"><span>free</span><span>${escapeHTML(pool.properties.free.value)}</span></div>

  async function fetchPools() {
    try {
      const res = await fetch('/api/zpool');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      renderPools(data);
      return data;
    } catch (err) {
      const el = document.getElementById('pools-state');
      document.getElementById('pools-grid').innerHTML = '';
      el.innerHTML = `<div class="err">⚠ failed to load pool data<div class="err-detail">${escapeHTML(err.message)}</div></div>`;
      return null;
    }

  function renderPools(data) {
    const grid = document.getElementById('pools-grid');
    const state = document.getElementById('pools-state');
    grid.innerHTML = '';
    if (!data || !data.pools || Object.keys(data.pools).length === 0) {
      state.innerHTML = 'no pools found or command returned empty data.';
      return;
    }
    state.innerHTML = '';
    for (const [name, pool] of Object.entries(data.pools)) {
      grid.innerHTML += renderPool(name, pool);
    }
  }

  /* ── ARC rendering + live stream ─────────────────────────── */
  function pushStreamBucket(arc) {
    const h = Number(arc.hits) || 0;
    const m = Number(arc.misses) || 0;
    let dh = 0, dm = 0;
    if (prevHits !== null) {
      if (h < prevHits || m < prevMisses) {
        prevHits = h;
        prevMisses = m;
      } else {
        dh = h - prevHits;
        dm = m - prevMisses;
        prevHits = h;
        prevMisses = m;
      }
    } else {
      prevHits = h;
      prevMisses = m;
    }
    streamBuckets.push({ h: dh, m: dm });
    if (streamBuckets.length > STREAM_LEN) streamBuckets.shift();
  }

  function initStream() {
    const el = document.getElementById('arc-stream');
    if (!el) return;
    const stream = el.querySelector('.stream');
    if (!stream) return;
    let cols = '';
    for (let i = 0; i < STREAM_LEN; i++) {
      cols += `<div class="stream-col">
        <div class="stream-cell miss"></div>
        <div class="stream-cell hit"></div>
      </div>`;
    }
    stream.innerHTML = cols;
    streamCols = Array.from(stream.children);
  }

  function renderStream(hitPct) {
    const card = document.getElementById('arc-stream');
    if (!card || !streamCols) return;
    const badge = document.getElementById('arc-stream-badge');
    if (badge && typeof hitPct === 'number') {
      badge.textContent = (hitPct >= 0 ? hitPct.toFixed(2) : '—') + '% hit';
      badge.className = 'badge ' +
        (hitPct > 70 ? 'b-online' : hitPct > 40 ? 'b-degraded' : 'b-offline');
    }
    const countEl = document.getElementById('arc-stream-count');
    if (countEl) countEl.textContent = streamBuckets.length + ' samples';

    const observed = Math.max(1, ...streamBuckets.map(b => Math.max(b.h, b.m)));
    if (observed > streamScaleRef) {
      streamScaleRef = observed;
    } else {
      streamScaleRef = Math.max(observed, streamScaleRef * 0.92);
    }
    const max = Math.max(1, streamScaleRef);

    const n = streamBuckets.length;
    for (let i = 0; i < STREAM_LEN; i++) {
      const col = streamCols[i];
      const bucketIdx = n - STREAM_LEN + i;
      const b = bucketIdx >= 0 ? streamBuckets[bucketIdx] : null;
      const hit = col.querySelector('.stream-cell.hit');
      const miss = col.querySelector('.stream-cell.miss');
      if (!b) {
        hit.style.height = '0%';
        miss.style.height = '0%';
        continue;
      }
      const hH = (b.h / max) * 100;
      const mH = (b.m / max) * 100;
      hit.style.height = hH.toFixed(2) + '%';
      miss.style.height = mH.toFixed(2) + '%';
      if (i === STREAM_LEN - 1) {
        hit.classList.remove('stream-rise-new');
        miss.classList.remove('stream-rise-new');
        void hit.offsetWidth;
        hit.classList.add('stream-rise-new');
        miss.classList.add('stream-rise-new');
      }
    }
  }

  function renderARC(arc) {
    const grid = document.getElementById('arc-grid');
    const state = document.getElementById('arc-state');
    state.innerHTML = '';

    const total = arc.hits + arc.misses;
    const hitPct = total ? (arc.hits / total * 100) : 0;
    const missPct = total ? (arc.misses / total * 100) : 0;

    const mruHits = arc.mru_hits || 0;
    const mfuHits = arc.mfu_hits || 0;
    const totalHit = mruHits + mfuHits || 1;
    const mruPct = (mruHits / totalHit) * 100;
    const mfuPct = (mfuHits / totalHit) * 100;

    const sizePct = arc.c_max ? (arc.size / arc.c_max * 100) : 0;
    const targetPct = arc.c_max ? (arc.c / arc.c_max * 100) : 0;

    const demHits = arc.demand_data_hits + arc.demand_metadata_hits;
    const preHits = arc.prefetch_data_hits + arc.prefetch_metadata_hits;
    const demMisses = arc.demand_data_misses + arc.demand_metadata_misses;
    const preMisses = arc.prefetch_data_misses + arc.prefetch_metadata_misses;

    hitHistory.push(hitPct);
    missHistory.push(arc.misses);
    sizeHistory.push(arc.size);
    if (hitHistory.length > HIST_LEN) hitHistory.shift();
    if (missHistory.length > HIST_LEN) missHistory.shift();
    if (sizeHistory.length > HIST_LEN) sizeHistory.shift();

    pushStreamBucket(arc);

    grid.innerHTML = `
      <!-- Hit ratio donut card -->
      <div class="card" data-accent="arc">
        <div class="card-head"><span class="card-title">Cache Hit Ratio</span>

      </div>

      <!-- ARC size card -->
      <div class="card" data-accent="arc">
        <div class="card-head"><span class="card-title">ARC Memory</span>
          <span class="badge b-online">${sizePct.toFixed(0)}% full</span>
        </div>
        <div class="donut-row">
          <div class="donut">
            ${donutSVG([
              { value: sizePct, color: C.amberSoft },
              { value: Math.max(targetPct - sizePct, 0), color: C.cyan },
              { value: Math.max(100 - targetPct, 0), color: 'var(--bar-bg)' }
            ])}
            <div class="donut-center">
              <div class="donut-pct" style="color:var(--phosphor-bright)">${fmtBytes(arc.size)}</div>
              <div class="donut-label">used</div>
            </div>
          </div>
          <div class="legend">
            <div class="leg-item"><span class="leg-dot" style="background:${C.amberSoft}"></span>Current<span class="leg-val">${fmtBytes(arc.size)}</span></div>
            <div class="leg-item"><span class="leg-dot" style="background:${C.cyan}"></span>Target<span class="leg-val">${fmtBytes(arc.c)}</span></div>
            <div class="leg-item"><span class="leg-dot" style="background:${C.green}"></span>Min<span class="leg-val">${fmtBytes(arc.c_min)}</span></div>
            <div class="leg-item"><span class="leg-dot" style="background:${C.red}"></span>Max<span class="leg-val">${fmtBytes(arc.c_max)}</span></div>
          </div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>Size vs Max</span><span>${sizePct.toFixed(1)}%</span></div>
          <div class="bar"><div class="bar-fill" style="width:${sizePct}%;background:linear-gradient(90deg,${C.amberSoft},${C.amber})"></div></div>
        </div>
      </div>

      <!-- MRU vs MFU card -->
      <div class="card" data-accent="arc">
        <div class="card-head"><span class="card-title">MRU vs MFU Hits</span></div>
        <div class="donut-row">
          <div class="donut">
            ${donutSVG([
              { value: mruPct, color: C.amber },
              { value: mfuPct, color: C.cyan }

          </div>
          <div class="legend">
            <div class="leg-item"><span class="leg-dot" style="background:${C.amber}"></span>MRU hits<span class="leg-val">${fmtNum(mruHits)}</span></div>
            <div class="leg-item"><span class="leg-dot" style="background:${C.cyan}"></span>MFU hits<span class="leg-val">${fmtNum(mfuHits)}</span></div>
            <div class="leg-item"><span class="leg-dot" style="background:${C.purple}"></span>MRU ghost<span class="leg-val">${fmtNum(arc.mru_ghost_hits)}</span></div>
            <div class="leg-item"><span class="leg-dot" style="background:${C.amberSoft}"></span>MFU ghost<span class="leg-val">${fmtNum(arc.mfu_ghost_hits)}</span></div>
          </div>
        </div>
      </div>

      <!-- Demand vs Prefetch card -->
      <div class="card" data-accent="arc">
        <div class="card-head"><span class="card-title">Demand vs Prefetch</span></div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Demand Hits</div><div class="tile-value mint">${fmtNum(demHits)}</div></div>
          <div class="tile"><div class="tile-label">Demand Miss</div><div class="tile-value crimson">${fmtNum(demMisses)}</div></div>
          <div class="tile"><div class="tile-label">Prefetch Hits</div><div class="tile-value cyan">${fmtNum(preHits)}</div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>Demand hit rate</span><span>${(demHits+demMisses) ? (demHits/(demHits+demMisses)*100).toFixed(1) : 0}%</span></div>
          <div class="bar"><div class="bar-fill" style="width:${(demHits+demMisses) ? (demHits/(demHits+demMisses)*100) : 0}%;background:linear-gradient(90deg,${C.green},${C.cyan})"></div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>Prefetch hit rate</span><span>${(preHits+preMisses) ? (preHits/(preHits+preMisses)*100).toFixed(1) : 0}%</span></div>
          <div class="bar"><div class="bar-fill" style="width:${(preHits+preMisses) ? (preHits/(preHits+preMisses)*100) : 0}%;background:linear-gradient(90deg,${C.amber},${C.red})"></div></div>
        </div>
      </div>

      <!-- Memory breakdown card -->
      <div class="card" data-accent="arc">
        <div class="card-head"><span class="card-title">Memory Breakdown</span></div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Data</div><div class="tile-value cyan">${fmtBytes(arc.data_size)}</div></div>
          <div class="tile"><div class="tile-label">Metadata</div><div class="tile-value violet">${fmtBytes(arc.metadata_size)}</div></div>
          <div class="tile"><div class="tile-label">Headers</div><div class="tile-value amber">${fmtBytes(arc.hdr_size)}</div></div>
        </div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Dbuf</div><div class="tile-value mint">${fmtBytes(arc.dbuf_size)}</div></div>

          <div class="tile"><div class="tile-label">Evicted</div><div class="tile-value crimson">${fmtBytes(arc.deleted)}</div></div>

      <!-- L2ARC card -->

      <div class="card" data-accent="arc">
        <div class="card-head"><span class="card-title">L2ARC</span>
          <span class="badge b-online">${arc.l2_ndev} device${arc.l2_ndev !== 1 ? 's' : ''}</span>
        </div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">L2 Size</div><div class="tile-value violet">${fmtBytes(arc.l2_size)}</div></div>
          <div class="tile"><div class="tile-label">L2 Asize</div><div class="tile-value cyan">${fmtBytes(arc.l2_asize)}</div></div>
          <div class="tile"><div class="tile-label">L2 Hits</div><div class="tile-value mint">${fmtNum(arc.l2_hits)}</div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>L2 hit rate</span><span>${(arc.l2_hits+arc.l2_misses) ? (arc.l2_hits/(arc.l2_hits+arc.l2_misses)*100).toFixed(1) : 0}%</span></div>
          <div class="bar"><div class="bar-fill" style="width:${(arc.l2_hits+arc.l2_misses) ? (arc.l2_hits/(arc.l2_hits+arc.l2_misses)*100) : 0}%;background:linear-gradient(90deg,${C.purple},${C.cyan})"></div></div>

      <div class="card" data-accent="arc">
        <div class="card-head"><span class="card-title">L2ARC</span></div>
        <div class="state" style="padding:30px 10px">no L2ARC device detected</div>

  }

  async function fetchARC() {
    try {
      const res = await fetch('/api/arc');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      renderARC(data);
      return data;
    } catch (err) {
      const el = document.getElementById('arc-state');
      document.getElementById('arc-grid').innerHTML = '';
      el.innerHTML = `<div class="err">⚠ failed to load ARC data<div class="err-detail">${escapeHTML(err.message)}</div></div>`;
      return null;
    }
  }

  /* ── SMART drives (dynamic per-drive tabs) ──────────────── */
  const smartTabs = new Map();

  function sanitizeTabId(name) {
    return (name || '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  function deviceLabel(name) {
    return 'SMART ' + (name || '?');
  }

  function healthClassForSmart(details) {
    if (!details) return 'b-offline';
    if (!details.smart_passed) return 'b-offline';
    if (details.nvme && details.nvme.critical_warning > 0) return 'b-degraded';
    if (details.ata) {
      const criticalIds = [5, 197, 198];
      for (const a of details.ata.attributes) {
        if (criticalIds.includes(a.id) && a.raw > 0) return 'b-degraded';
      }
    }
    return 'b-online';
  }

  function fmtTemp(cur, warn, crit) {
    if (cur == null) return '—';
    let s = cur + '°C';
    if (crit) s += ` <span style="color:var(--dim)">/ crit ${crit}°C</span>`;
    else if (warn) s += ` <span style="color:var(--dim)">/ warn ${warn}°C</span>`;
    return s;
  }

  function tempColor(cur, warn, crit) {
    if (cur == null) return 'var(--text)';
    if (crit && cur >= crit) return 'var(--crimson)';
    if (warn && cur >= warn) return 'var(--amber-warn)';
    return 'var(--mint)';
  }

  function renderNVMeCard(details) {
    const n = details.nvme;
    if (!n) return '';
    const sparePct = n.available_spare_threshold
      ? Math.min((n.available_spare / n.available_spare_threshold) * 100, 100) : 100;
    const endurancePct = Math.min(n.percentage_used, 100);
    const enduranceColor = endurancePct > 80 ? C.red
      : endurancePct > 60 ? C.amber : C.green;
    const warnFlags = n.critical_warning > 0
      ? `<span class="badge b-degraded">critical warning 0x${n.critical_warning.toString(16)}</span>`
      : `<span class="badge b-online">healthy</span>`;
    return `
      <div class="card" data-accent="pool">
        <div class="card-head"><span class="card-title">NVMe Health</span>${warnFlags}</div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Endurance Used</div><div class="tile-value ${endurancePct > 80 ? 'crimson' : endurancePct > 60 ? 'amber' : 'mint'}">${endurancePct}%</div></div>
          <div class="tile"><div class="tile-label">Spare</div><div class="tile-value cyan">${n.available_spare}% / ${n.available_spare_threshold}%</div></div>
          <div class="tile"><div class="tile-label">Media Errors</div><div class="tile-value ${n.media_errors > 0 ? 'crimson' : 'mint'}">${fmtNum(n.media_errors)}</div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>Endurance used</span><span>${endurancePct}%</span></div>
          <div class="bar"><div class="bar-fill" style="width:${endurancePct}%;background:linear-gradient(90deg,${enduranceColor},${enduranceColor})"></div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>Available spare vs threshold</span><span>${n.available_spare}%</span></div>
          <div class="bar"><div class="bar-fill" style="width:${sparePct}%;background:linear-gradient(90deg,${C.cyan},${C.green})"></div></div>
        </div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Data Read</div><div class="tile-value violet">${fmtNum(n.data_units_read * 512 * 1000)}</div></div>
          <div class="tile"><div class="tile-label">Data Written</div><div class="tile-value violet">${fmtNum(n.data_units_written * 512 * 1000)}</div></div>
          <div class="tile"><div class="tile-label">Host Reads</div><div class="tile-value cyan">${fmtNum(n.host_reads)}</div></div>
        </div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Host Writes</div><div class="tile-value cyan">${fmtNum(n.host_writes)}</div></div>
          <div class="tile"><div class="tile-label">Unsafe Shutdowns</div><div class="tile-value ${n.unsafe_shutdowns > 0 ? 'amber' : 'mint'}">${fmtNum(n.unsafe_shutdowns)}</div></div>
          <div class="tile"><div class="tile-label">Err Log Entries</div><div class="tile-value ${n.num_err_log_entries > 0 ? 'amber' : 'mint'}">${fmtNum(n.num_err_log_entries)}</div></div>
        </div>
        ${n.temperature_sensors && n.temperature_sensors.length ? `
        <div class="muted-note">temp sensors: ${n.temperature_sensors.map(t => t + '°C').join(' · ')}</div>` : ''}
      </div>`;
  }

  function renderSmartPane(dev, paneEl) {
    const d = dev.details;
    if (!d) {
      paneEl.innerHTML = `<div class="state"><div class="err">⚠ SMART probe failed<div class="err-detail">${escapeHTML(dev.error || 'unknown error')}</div></div></div>`;
      return;
    }
    const hc = healthClassForSmart(d);
    const passedBadge = d.smart_passed
      ? `<span class="badge ${hc}">PASSED</span>`
      : `<span class="badge b-offline">FAILED</span>`;
    const isRotating = d.rotation_rate > 0;
    const driveKind = d.protocol === 'NVMe' ? 'NVMe SSD'
      : (isRotating ? `HDD · ${d.rotation_rate} rpm` : 'SATA SSD');
    const tempC = tempColor(d.temperature_current, d.temperature_warning, d.temperature_critical);
    const tempPct = d.temperature_critical
      ? Math.min((d.temperature_current / d.temperature_critical) * 100, 100) : 0;

    paneEl.innerHTML = `
      <div class="card" style="grid-column:1 / -1">
        <div class="card-head"><span class="card-title">${escapeHTML(dev.name)} · ${escapeHTML(d.model_name || 'unknown')}</span>${passedBadge}</div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Model</div><div class="tile-value cyan" style="font-size:0.8rem">${escapeHTML(d.model_family || d.model_name || '—')}</div></div>
          <div class="tile"><div class="tile-label">Serial</div><div class="tile-value violet" style="font-size:0.8rem">${escapeHTML(d.serial_number || '—')}</div></div>
          <div class="tile"><div class="tile-label">Firmware</div><div class="tile-value amber">${escapeHTML(d.firmware_version || '—')}</div></div>
          <div class="tile"><div class="tile-label">Capacity</div><div class="tile-value cyan">${fmtBytes(d.capacity_bytes)}</div></div>
          <div class="tile"><div class="tile-label">Kind</div><div class="tile-value violet">${escapeHTML(driveKind)}</div></div>
          <div class="tile"><div class="tile-label">Transport</div><div class="tile-value amber">${escapeHTML(d.protocol || '—')} · ${escapeHTML(d.device_type || '—')}</div></div>
          ${d.form_factor ? `<div class="tile"><div class="tile-label">Form Factor</div><div class="tile-value violet">${escapeHTML(d.form_factor)}</div></div>` : ''}
          <div class="tile"><div class="tile-label">Power-On Hours</div><div class="tile-value mint">${fmtNum(d.power_on_hours)}</div></div>
          <div class="tile"><div class="tile-label">Power Cycles</div><div class="tile-value mint">${fmtNum(d.power_cycle_count)}</div></div>
        </div>
      </div>

      <div class="card" data-accent="arc">
        <div class="card-head"><span class="card-title">Temperature</span>
          <span class="badge ${d.temperature_critical && d.temperature_current >= d.temperature_critical ? 'b-offline' : d.temperature_warning && d.temperature_current >= d.temperature_warning ? 'b-degraded' : 'b-online'}">${d.temperature_current != null ? d.temperature_current + '°C' : '—'}</span>
        </div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Current</div><div class="tile-value ${d.temperature_critical && d.temperature_current >= d.temperature_critical ? 'crimson' : d.temperature_warning && d.temperature_current >= d.temperature_warning ? 'amber' : 'mint'}" style="font-size:1.3rem">${d.temperature_current != null ? d.temperature_current + '°' : '—'}</div></div>
          <div class="tile"><div class="tile-label">Warn Limit</div><div class="tile-value amber">${d.temperature_warning || '—'}°</div></div>
          <div class="tile"><div class="tile-label">Crit Limit</div><div class="tile-value crimson">${d.temperature_critical || '—'}°</div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>current vs critical</span><span>${d.temperature_current != null ? d.temperature_current + '°C' : '—'}</span></div>
          <div class="bar"><div class="bar-fill" style="width:${tempPct}%;background:linear-gradient(90deg,${tempC},${tempC})"></div></div>
        </div>
        <div class="muted-note">color reflects current temperature vs. published limits</div>
      </div>

      ${d.nvme ? renderNVMeCard(d) : ''}

      ${(!d.nvme && !d.ata) ? `
      <div class="card" data-accent="pool">
        <div class="card-head"><span class="card-title">Health Summary</span></div>
        <div class="state" style="padding:30px 10px">no transport-specific health log available for this device</div>
        <div class="muted-note">SCSI/libata devices may not expose SMART attributes</div>
      </div>` : ''}
    `;
  }

  function smartSortKey(dev) {
    const proto = (dev.protocol || (dev.details && dev.details.protocol) || '').toUpperCase();
    const isNvme = proto === 'NVME' || /nvme/i.test(dev.name || '');
    return (isNvme ? '0:' : '1:') + (dev.name || '');
  }

  function ensureSmartTab(dev) {
    const id = 'smart-' + sanitizeTabId(dev.name);
    let btn = smartTabs.get(dev.name);
    if (btn) {
      const pane = document.getElementById('pane-' + id);
      if (pane) renderSmartPane(dev, pane);
      return btn;
    }
    btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.tab = id;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('type', 'button');
    const hc = healthClassForSmart(dev.details);
    const dot = dev.details
      ? `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:${hc === 'b-online' ? 'var(--mint)' : hc === 'b-degraded' ? 'var(--amber-warn)' : 'var(--crimson)'};box-shadow:0 0 6px currentColor"></span>`
      : '';
    btn.innerHTML = dot + escapeHTML(deviceLabel(dev.name));
    if (!dev.details) {
      btn.style.opacity = '0.55';
      btn.title = 'SMART probe failed: ' + (dev.error || 'unknown');
    }
    document.querySelector('.tabs').appendChild(btn);
    const pane = document.createElement('section');
    pane.id = 'pane-' + id;
    pane.className = 'pane';
    document.querySelector('.wrap').appendChild(pane);
    renderSmartPane(dev, pane);
    smartTabs.set(dev.name, btn);
    return btn;
  }

  function clearSmartTabs() {
    for (const [name, btn] of smartTabs) {
      if (btn) btn.remove();
      const pane = document.getElementById('pane-' + 'smart-' + sanitizeTabId(name));
      if (pane) pane.remove();
    }
    smartTabs.clear();
    if (activeTab && activeTab.startsWith('smart-')) {
      document.querySelector('.tab[data-tab="system"]').click();
    }
  }

  async function fetchSmart() {
    try {
      const res = await fetch('/api/smart');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      applySmartCap(data);
      if (!caps.smart || !data.devices || data.devices.length === 0) {
        clearSmartTabs();
        return data;
      }
      const sorted = [...data.devices].sort((a, b) => {
        const ka = smartSortKey(a), kb = smartSortKey(b);
        return ka < kb ? -1 : ka > kb ? 1 : 0;
      });
      const seen = new Set();
      for (const dev of sorted) {
        seen.add(dev.name);
        ensureSmartTab(dev);
      }
      const tabsNav = document.querySelector('.tabs');
      for (const dev of sorted) {
        const btn = smartTabs.get(dev.name);
        if (btn) tabsNav.appendChild(btn);
      }
      for (const [name, btn] of [...smartTabs]) {
        if (!seen.has(name)) {
          if (btn) btn.remove();
          const pane = document.getElementById('pane-' + 'smart-' + sanitizeTabId(name));
          if (pane) pane.remove();
          smartTabs.delete(name);
        }
      }
      return data;
    } catch (err) {
      applySmartCap({ smartctl_available: false });
      clearSmartTabs();
      return null;
    }
  }

  function applySmartCap(report) {
    caps.smart = !!(report && report.smartctl_available && report.devices && report.devices.length);
  }

  async function refreshAll() {
    lastRefresh = Date.now();
    const fab = document.getElementById('fab');
    fab.classList.add('refreshing');
    try {
      const sys = await fetchSysInfo();
      const tasks = [];
      tasks.push(caps.zfs ? fetchPools() : Promise.resolve(null));
      tasks.push(caps.arc ? fetchARC() : Promise.resolve(null));
      tasks.push(fetchSmart());
      const [pools, arc] = await Promise.all(tasks);
      renderKPIs(pools, arc);
    } finally {
      setTimeout(() => fab.classList.remove('refreshing'), 500);
    }
  }

  initStream();
  refreshAll();
  timer = setInterval(refreshAll, REFRESH_MS);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearInterval(timer); timer = null; }
    else if (!timer) { timer = setInterval(refreshAll, REFRESH_MS); }
  });
</script>
</body>
</html>
