 <!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>zDash — ZFS Pool &amp; ARC Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap');

/* ════════════════════════════════════════════════════════════
   THEME: LIGHT — frosted glass over security-blue
   ════════════════════════════════════════════════════════════ */
:root,
:root[data-theme="light"] {
  color-scheme: light;
  --bg-0: #eef4fb;
  --bg-1: #e2ecf6;
  --grad-bg:
    radial-gradient(130% 100% at 12% -12%, rgba(14,165,233,0.16), transparent 55%),
    radial-gradient(110% 80% at 100% -10%, rgba(3,105,161,0.13), transparent 50%),
    radial-gradient(80% 60% at 85% 110%, rgba(22,163,74,0.08), transparent 55%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
  --grid-line: rgba(3,105,161,0.05);

  --glass: rgba(255,255,255,0.62);
  --glass-2: rgba(255,255,255,0.40);
  --glass-hover: rgba(255,255,255,0.82);
  --blur: 18px;
  --line: rgba(3,105,161,0.13);
  --line-strong: rgba(3,105,161,0.30);

  --text: #0b2e46;
  --muted: #456881;
  --dim: #6d8ba1;
  --on-accent: #ffffff;

  --phosphor: #0369a1;
  --phosphor-bright: #0c4a6e;
  --mint: #0d9668;
  --cyan: #0891b2;
  --crimson: #dc2626;
  --violet: #7c3aed;
  --amber-warn: #d97706;

  --c-green: #0d9668;
  --c-red: #e6425a;
  --c-amber: #e08a16;
  --c-cyan: #0891b2;
  --c-purple: #7c3aed;
  --c-amber-soft: #f0a639;

  --grad-accent: linear-gradient(135deg, #0369a1, #0ea5e9);
  --grad-ok: linear-gradient(135deg, #0d9668, #10b981);
  --grad-warn: linear-gradient(135deg, #d97706, #f59e0b);
  --grad-danger: linear-gradient(135deg, #dc2626, #ef4444);

  --glow: none;
  --glow-mint: none;
  --glow-crimson: none;

  --shadow: 0 1px 2px rgba(12,74,110,0.05), 0 10px 30px rgba(12,74,110,0.10);
  --shadow-lg: 0 2px 4px rgba(12,74,110,0.06), 0 20px 48px rgba(12,74,110,0.16);
  --tile-bg: rgba(3,105,161,0.05);
  --tile-hover: rgba(3,105,161,0.09);
  --bar-bg: rgba(3,105,161,0.10);
  --spark-bg: rgba(3,105,161,0.04);
  --disk-t1: rgba(3,105,161,0.10);
  --disk-t2: rgba(3,105,161,0.20);
  --disk-t3: rgba(3,105,161,0.32);

  --radius: 20px;
  --radius-sm: 13px;
  --radius-pill: 999px;
  --font-ui: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Fira Code', ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace;
  --transition: 0.25s cubic-bezier(0.22,1,0.36,1);
  --kpi-bg: var(--glass-2);
  --kpi-hover: var(--glass-hover);
  --kpi-border: var(--line);
  --badge-online-bg: rgba(13,150,104,0.12);
  --badge-degraded-bg: rgba(217,119,6,0.12);
  --badge-offline-bg: rgba(220,38,38,0.12);
  --tab-active-bg: rgba(255,255,255,0.7);
  --tab-indicator: var(--phosphor);
  --fab-bg: var(--glass);
  --ambient-blob-a: rgba(14,165,233,0.16);
  --ambient-blob-b: rgba(124,58,237,0.10);
  --ambient-blob-c: rgba(13,150,104,0.10);
  --scanline-opacity: 0;
}

/* ════════════════════════════════════════════════════════════
   THEME: DARK — deep space glass, cyan security glow
   ════════════════════════════════════════════════════════════ */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-0: #050a12;
  --bg-1: #081120;
  --grad-bg:
    radial-gradient(120% 90% at 15% -10%, rgba(14,165,233,0.13), transparent 55%),
    radial-gradient(100% 80% at 100% -10%, rgba(56,189,248,0.10), transparent 50%),
    radial-gradient(70% 55% at 80% 115%, rgba(124,58,237,0.10), transparent 55%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
  --grid-line: rgba(125,190,255,0.045);

  --glass: rgba(13,28,44,0.58);
  --glass-2: rgba(11,24,38,0.38);
  --glass-hover: rgba(22,44,66,0.70);
  --blur: 20px;
  --line: rgba(125,190,255,0.12);
  --line-strong: rgba(125,190,255,0.30);

  --text: #d9e9f6;
  --muted: #7d97ac;
  --dim: #4f6579;
  --on-accent: #05111d;

  --phosphor: #38bdf8;
  --phosphor-bright: #7dd3fc;
  --mint: #34d399;
  --cyan: #22d3ee;
  --crimson: #fb7185;
  --violet: #a78bfa;
  --amber-warn: #fbbf24;

  --c-green: #34d399;
  --c-red: #fb7185;
  --c-amber: #fbbf24;
  --c-cyan: #22d3ee;
  --c-purple: #a78bfa;
  --c-amber-soft: #fcd34d;

  --grad-accent: linear-gradient(135deg, #0ea5e9, #38bdf8);
  --grad-ok: linear-gradient(135deg, #10b981, #34d399);
  --grad-warn: linear-gradient(135deg, #f59e0b, #fbbf24);
  --grad-danger: linear-gradient(135deg, #ef4444, #fb7185);

  --glow: 0 0 12px rgba(56,189,248,0.28);
  --glow-mint: 0 0 12px rgba(52,211,153,0.28);
  --glow-crimson: 0 0 12px rgba(251,113,133,0.28);

  --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 12px 32px rgba(0,0,0,0.45);
  --shadow-lg: 0 2px 4px rgba(0,0,0,0.4), 0 24px 56px rgba(0,0,0,0.6);
  --tile-bg: rgba(125,190,255,0.05);
  --tile-hover: rgba(125,190,255,0.10);
  --bar-bg: rgba(125,190,255,0.09);
  --spark-bg: rgba(125,190,255,0.04);
  --disk-t1: rgba(56,189,248,0.10);
  --disk-t2: rgba(56,189,248,0.18);
  --disk-t3: rgba(56,189,248,0.30);

  --radius: 20px;
  --radius-sm: 13px;
  --radius-pill: 999px;
  --font-ui: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Fira Code', ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace;
  --transition: 0.25s cubic-bezier(0.22,1,0.36,1);
  --kpi-bg: var(--glass-2);
  --kpi-hover: var(--glass-hover);
  --kpi-border: var(--line);
  --badge-online-bg: rgba(52,211,153,0.12);
  --badge-degraded-bg: rgba(251,191,36,0.12);
  --badge-offline-bg: rgba(251,113,133,0.12);
  --tab-active-bg: rgba(56,189,248,0.12);
  --tab-indicator: var(--phosphor);
  --fab-bg: var(--glass);
  --ambient-blob-a: rgba(14,165,233,0.12);
  --ambient-blob-b: rgba(124,58,237,0.10);
  --ambient-blob-c: rgba(34,211,238,0.08);
  --scanline-opacity: 0.02;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html, body { background: var(--grad-bg); background-attachment: fixed; }
body {
  font-family: var(--font-ui);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.55;
  letter-spacing: 0.005em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  position: relative;
  overflow-x: hidden;
  padding-bottom: 110px;
}

/* subtle engineering grid overlay */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(90% 70% at 50% 0%, #000 30%, transparent 100%);
  mask-image: radial-gradient(90% 70% at 50% 0%, #000 30%, transparent 100%);
  opacity: var(--scanline-opacity);
}

/* ambient light blobs */
.blob { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
.blob-a { width: 560px; height: 560px; top: -180px; left: -140px; background: var(--ambient-blob-a); }
.blob-b { width: 440px; height: 440px; top: 20%; right: -160px; background: var(--ambient-blob-b); }
.blob-c { width: 520px; height: 520px; bottom: -220px; left: 30%; background: var(--ambient-blob-c); }

.wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 2; }

/* ── glass primitives ─────────────────────────────────────── */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
  backdrop-filter: blur(var(--blur)) saturate(150%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  transition: background var(--transition), border-color var(--transition),
    transform var(--transition), box-shadow var(--transition);
  position: relative;
}
.glass::before { /* top gloss highlight */
  content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  opacity: 0.6; pointer-events: none;
}
:root[data-theme="dark"] .glass::before {
  background: linear-gradient(90deg, transparent, rgba(125,190,255,0.22), transparent);
}
.glass-hover:hover {
  background: var(--glass-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: var(--line-strong);
}

/* ── navbar ────────────────────────────────────────────────── */
.navbar {
  display: flex; align-items: center; gap: 16px;
  position: sticky; top: 12px; z-index: 40;
  padding: 10px 16px; border-radius: var(--radius-pill);
  margin: 16px 0 30px;
}
.nav-brand {
  display: flex; align-items: baseline; gap: 4px;
  font-weight: 800; font-size: 1.25rem; letter-spacing: -0.02em;
  color: var(--phosphor-bright); white-space: nowrap;
}
.brand-host { font-weight: 600; font-size: 0.78rem; color: var(--muted); margin-left: 2px; }
.nav-links { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.nav-item {
  appearance: none; background: transparent; border: 1px solid transparent;
  color: var(--muted); font-family: var(--font-ui); font-size: 0.85rem; font-weight: 500;
  text-decoration: none; cursor: pointer; padding: 8px 14px; border-radius: var(--radius-pill);
  transition: all var(--transition); display: inline-flex; align-items: center; gap: 6px;
}
.nav-item:hover { color: var(--text); background: var(--tile-bg); border-color: var(--line); }
.nav-item.active { color: var(--on-accent); background: var(--grad-accent); border-color: transparent; box-shadow: var(--glow); }
.nav-right { display: flex; align-items: center; gap: 10px; }
.live {
  display: inline-flex; align-items: center; gap: 7px; color: var(--mint);
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em;
}
.live::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mint);
  box-shadow: var(--glow-mint); animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 0.45; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }
.theme-toggle {
  appearance: none; cursor: pointer;
  width: 40px; height: 40px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--glass-2); border: 1px solid var(--line); color: var(--phosphor-bright);
  transition: all var(--transition);
}
.theme-toggle:hover { background: var(--glass-hover); border-color: var(--line-strong); transform: translateY(-1px); box-shadow: var(--glow); }
.theme-toggle svg { width: 19px; height: 19px; display: block; }

/* ── dashboard shell ──────────────────────────────────────── */
.dash-head {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 14px; margin: 8px 0 22px;
}
.dash-title { display: flex; align-items: center; gap: 14px; }
.dash-heading { display: flex; flex-direction: column; gap: 2px; }
.dash-title h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
.page-sub { font-size: 0.76rem; color: var(--dim); letter-spacing: 0.07em; font-family: var(--font-mono); }
.dash-meta { display: flex; align-items: center; gap: 14px; font-size: 0.78rem; color: var(--dim); }
.version-box, .v-box {
  font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600;
  color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 4px 10px; background: var(--glass-2);
}
.version-box .v-label { color: var(--dim); margin-right: 4px; }
.version-box .v-tag { color: var(--phosphor); text-decoration: none; }
.version-box .v-tag:hover { text-decoration: underline; }

/* KPI strip */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 26px; perspective: 1000px; }
.kpi {
  background: var(--kpi-bg); border: 1px solid var(--kpi-border);
  border-radius: var(--radius-sm); padding: 18px 20px 22px; position: relative;
  overflow: hidden; transition: all var(--transition);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  backdrop-filter: blur(var(--blur)) saturate(140%);
}
.kpi::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--grad-accent); opacity: 0.75;
}
.kpi:hover { background: var(--kpi-hover); transform: perspective(900px) rotateX(2deg) translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--line-strong); }
.kpi-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.kpi-icon {
  width: 32px; height: 32px; padding: 7px; display: inline-flex; color: var(--phosphor); flex-shrink: 0;
  background: var(--tile-bg); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 3px 8px rgba(0,0,0,0.14);
}
.kpi-icon svg { width: 100%; height: 100%; display: block; }
.kpi-label { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted); font-weight: 700; }
.kpi-value { font-size: 1.65rem; font-weight: 800; margin-top: 7px; font-variant-numeric: tabular-nums; color: var(--phosphor-bright); font-family: var(--font-mono); letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi-value.txt { font-size: 1.12rem; letter-spacing: 0; line-height: 1.35; }
.kpi-sub { font-size: 0.72rem; color: var(--dim); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--phosphor), var(--cyan)); width: 0; transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }
.kpi[data-accent="pool"] .kpi-value { color: var(--phosphor-bright); }
.kpi[data-accent="ok"] .kpi-value { color: var(--mint); text-shadow: var(--glow-mint); }
.kpi[data-accent="warn"] .kpi-value { color: var(--amber-warn); }
.kpi[data-accent="err"] .kpi-value { color: var(--crimson); text-shadow: var(--glow-crimson); }
.kpi[data-accent="info"] .kpi-value { color: var(--cyan); }
.kpi[data-accent="violet"] .kpi-value { color: var(--violet); }
.kpi[data-accent="ok"] .kpi-bar { background: var(--grad-ok); }
.kpi[data-accent="warn"] .kpi-bar { background: var(--grad-warn); }
.kpi[data-accent="err"] .kpi-bar { background: var(--grad-danger); }
.kpi[data-accent="info"] .kpi-bar { background: linear-gradient(90deg, var(--cyan), var(--violet)); }
.kpi[data-accent="violet"] .kpi-bar { background: linear-gradient(90deg, var(--violet), var(--phosphor)); }

/* tabs */
.tabs { display: flex; gap: 8px; margin: 0 0 22px; width: 100%; overflow-x: auto; padding: 3px; position: relative; }
.tab {
  border: 1px solid var(--line); background: var(--glass-2); color: var(--muted); cursor: pointer;
  padding: 10px 20px 11px; font-family: var(--font-ui); font-size: 0.8rem; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap;
  border-radius: var(--radius-pill); transition: all var(--transition);
  display: inline-flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--text); background: var(--glass-hover); border-color: var(--line-strong); transform: translateY(-2px); }
.tab.active {
  color: var(--on-accent); background: var(--grad-accent);
  border-color: transparent; box-shadow: var(--glow);
}
.tab:focus-visible, .theme-toggle:focus-visible, .nav-item:focus-visible, .btn:focus-visible, .fab:focus-visible {
  outline: 2px solid var(--phosphor); outline-offset: 2px;
}
.pane { display: none; }
.pane.active { display: block; animation: pane-fade 0.4s ease; }
@keyframes pane-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* grid + cards (12-column layout, cards default to half width) */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; perspective: 1400px; }
.grid > .card { grid-column: span 6; }
.col-4 { grid-column: span 4; }
.col-5 { grid-column: span 5; }
.col-6 { grid-column: span 6; }
.col-7 { grid-column: span 7; }
.col-12 { grid-column: 1 / -1; }
.card {
  background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
  backdrop-filter: blur(var(--blur)) saturate(150%);
  border-radius: var(--radius); padding: 22px 24px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
  transition: border-color var(--transition), background var(--transition),
    transform var(--transition), box-shadow var(--transition);
}
.card::before {
  content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  opacity: 0.55; pointer-events: none;
}
:root[data-theme="dark"] .card::before {
  background: linear-gradient(90deg, transparent, rgba(125,190,255,0.2), transparent);
}
.card:hover { border-color: var(--line-strong); background: var(--glass-hover); transform: perspective(1200px) rotateX(1deg) translateY(-4px); box-shadow: var(--shadow-lg); }
.card[data-accent="arc"] { border-top: 2px solid var(--cyan); }
.card[data-accent="pool"] { border-top: 2px solid var(--phosphor); }

.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; }
.card-title { font-size: 0.86rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--phosphor-bright); }

.badge {
  padding: 4px 11px; border-radius: var(--radius-pill); font-size: 0.66rem;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.13em;
  border: 1px solid transparent; white-space: nowrap; font-family: var(--font-mono);
}
.b-online { background: var(--badge-online-bg); color: var(--mint); border-color: rgba(13,150,104,0.3); }
.b-degraded { background: var(--badge-degraded-bg); color: var(--amber-warn); border-color: rgba(217,119,6,0.35); }
.b-offline { background: var(--badge-offline-bg); color: var(--crimson); border-color: rgba(220,38,38,0.35); }
.b-neutral { background: var(--tile-bg); color: var(--muted); border-color: var(--line-strong); }
:root[data-theme="dark"] .b-online, :root[data-theme="dark"] .b-degraded, :root[data-theme="dark"] .b-offline { border-color: var(--line-strong); }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.tile { background: var(--tile-bg); border: 1px solid var(--line); padding: 13px 10px; border-radius: var(--radius-sm); text-align: center; transition: background var(--transition), border-color var(--transition); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 3px 8px rgba(0,0,0,0.10); }
.tile:hover { background: var(--tile-hover); border-color: var(--line-strong); }
.tile-label { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; font-family: var(--font-mono); }
.tile-value { font-size: 1.02rem; font-weight: 700; margin-top: 5px; color: var(--text); font-variant-numeric: tabular-nums; word-break: break-word; }
.tile-value.cyan { color: var(--cyan); }
.tile-value.mint { color: var(--mint); }
.tile-value.amber { color: var(--phosphor-bright); }
.tile-value.crimson { color: var(--crimson); }
.tile-value.violet { color: var(--violet); }

/* progress bars */
.bar-wrap { margin: 12px 0; }
.bar-head { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.09em; text-transform: uppercase; font-weight: 600; }
.bar-head span:last-child { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; text-transform: none; }
.bar { height: 10px; background: var(--bar-bg); border: 1px solid var(--line); border-radius: var(--radius-pill); overflow: hidden; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.18); }
.bar-fill { height: 100%; background: var(--fill, var(--grad-accent)); border-radius: var(--radius-pill); transition: width 0.7s cubic-bezier(0.4,0,0.2,1); position: relative; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -2px 3px rgba(0,0,0,0.28); }
.bar-fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent); animation: shimmer 3.2s infinite; }
@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

/* donut gauge */
.donut-row { display: flex; align-items: center; gap: 22px; }
.donut { position: relative; width: 132px; height: 132px; flex-shrink: 0; filter: drop-shadow(0 12px 20px rgba(0,0,0,0.35)); }
.donut svg { transform: rotate(-90deg); }
.donut::after {
  content: ""; position: absolute; left: 16%; right: 16%; bottom: -12px; height: 11px; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.30), transparent 70%); pointer-events: none;
}
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.donut-pct { font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.donut-label { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700; }
.legend { flex: 1; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.leg-item { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--text); font-weight: 500; }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.leg-val { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text); font-family: var(--font-mono); font-size: 0.78rem; }

/* stacked ratio bar */
.ratio-bar-wrap { margin: 10px 0 4px; }
.ratio-bar-head { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
.ratio-bar-head span:last-child { color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; text-transform: none; }
.ratio-bar { height: 14px; background: var(--bar-bg); border: 1px solid var(--line); border-radius: var(--radius-pill); overflow: hidden; display: flex; min-width: 0; }
.ratio-bar-seg { height: 100%; transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }

/* sparkline */
.spark { height: 56px; margin: 10px 0 3px; position: relative; border: 1px solid var(--line); background: var(--spark-bg); border-radius: var(--radius-sm); }
.spark svg { width: 100%; height: 100%; display: block; }
.spark-axis { display: flex; justify-content: space-between; font-size: 0.58rem; color: var(--dim); letter-spacing: 0.1em; margin-top: 3px; font-family: var(--font-mono); }

/* ring gauge row (pool capacity) */
.gauge-row { display: flex; align-items: center; gap: 22px; margin: 6px 0 16px; }

/* vdev list */
.vdevs { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
.vdevs-title { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.18em; margin-bottom: 9px; font-weight: 700; font-family: var(--font-mono); }
.vdev {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 9px 12px; background: var(--tile-bg); border-left: 2px solid var(--line);
  margin-bottom: 6px; border-radius: var(--radius-sm); font-size: 0.78rem;
  transition: all var(--transition);
}
.vdev:hover { background: var(--tile-hover); border-left-color: var(--phosphor); transform: translateX(3px); }
.vdev-name { color: var(--phosphor-bright); font-size: 0.76rem; word-break: break-all; font-weight: 600; font-family: var(--font-mono); }
.vdev-info { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 0.7rem; flex-shrink: 0; }
.type-chip {
  font-family: var(--font-mono); font-size: 0.56rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--phosphor); background: var(--tile-bg);
  border: 1px solid var(--line); border-radius: var(--radius-pill);
  padding: 2px 8px; white-space: nowrap;
}
.head-badges { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }

/* loading / error */
.state { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 0.92rem; }
.spinner { width: 42px; height: 42px; margin: 0 auto 16px; position: relative; }
.spinner::before, .spinner::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--line); border-top-color: var(--phosphor);
  animation: spin 1s linear infinite;
}
.spinner::after { inset: 7px; border-top-color: var(--cyan); animation-direction: reverse; animation-duration: 1.4s; }
@keyframes spin { to { transform: rotate(360deg); } }
.err { color: var(--crimson); }
.err-detail { font-size: 0.78rem; opacity: 0.8; margin-top: 8px; color: var(--muted); font-family: var(--font-mono); }
.state-err { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 10px; }
.state-err svg { width: 32px; height: 32px; color: var(--crimson); flex-shrink: 0; }
.state-err .err { font-size: 0.95rem; font-weight: 600; text-align: center; }
.state-err .err-detail { margin-top: 0; text-align: center; }
.muted-note { font-size: 0.72rem; color: var(--dim); margin-top: 13px; text-align: center; }

/* tiles variant with two columns */
.tiles.tiles-2 { grid-template-columns: repeat(2, 1fr); }

/* SMART attribute table */
.table-scroll { overflow-x: auto; margin: 6px 0 2px; }
.smart-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.74rem; }
.smart-table th {
  text-align: left; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--muted); font-weight: 700; padding: 8px 10px;
  border-bottom: 1px solid var(--line-strong); white-space: nowrap;
}
.smart-table td {
  padding: 7px 10px; border-bottom: 1px solid var(--line);
  color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.smart-table tr:last-child td { border-bottom: none; }
.smart-table tbody tr:hover td { background: var(--tile-hover); }
.smart-table .attr-id { color: var(--muted); }
.smart-table .attr-name { color: var(--phosphor-bright); font-weight: 600; }
.smart-table .attr-raw { color: var(--muted); }
.smart-table .t-ok { color: var(--mint); }
.smart-table .t-warn { color: var(--amber-warn); font-weight: 700; }
.smart-table .t-crit { color: var(--crimson); font-weight: 700; }

/* fastfetch-style key/value rows (host card) */
.fastfetch-logo {
  flex-shrink: 0; width: 124px; height: 124px; padding: 10px;
  background: var(--tile-bg); border: 1px solid var(--line);
  border-radius: var(--radius); position: relative;
  display: flex; align-items: center; justify-content: center;
}
.fastfetch-logo .distro-logo { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.18)); }
:root[data-theme="dark"] .distro-logo { filter: brightness(1.5) saturate(1.15) drop-shadow(0 4px 10px rgba(0,0,0,0.45)); }
.ff-row { display: flex; align-items: baseline; gap: 9px; font-size: 0.8rem; line-height: 1.45; }
.ff-key { color: var(--phosphor); font-weight: 600; min-width: 98px; flex-shrink: 0; font-size: 0.74rem; letter-spacing: 0.05em; font-family: var(--font-mono); }
.ff-sep { color: var(--dim); }
.ff-val { color: var(--text); font-size: 0.78rem; word-break: break-word; }
.ff-bar { flex: 1; max-width: 200px; margin-left: 4px; }
.ff-bar .bar { height: 6px; }
.ff-cols, .kv-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 32px; }
.ff-col { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
@media (max-width: 720px) { .ff-cols, .kv-list { grid-template-columns: 1fr; gap: 0; } }

/* host card head (logo + hostname + os/kernel) */
.host-card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; min-width: 0; }
.host-card-head .fastfetch-logo { width: 58px; height: 58px; padding: 7px; border-radius: var(--radius-sm); }
.host-head-text { min-width: 0; }
.host-name { font-size: 1.12rem; font-weight: 800; letter-spacing: -0.01em; color: var(--phosphor-bright); word-break: break-word; }
.host-os { font-size: 0.72rem; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; word-break: break-word; }

/* big uptime hero (system tab) */
.uptime-hero {
  font-family: var(--font-mono); font-size: 1.9rem; font-weight: 800;
  color: var(--cyan); text-align: center; padding: 12px 0 10px;
  font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  text-shadow: 0 0 18px rgba(34,211,238,0.25);
}
:root[data-theme="light"] .uptime-hero { text-shadow: none; }

/* ARC live stream */
.stream-card { margin-bottom: 18px; }
.stream { display: flex; gap: 2px; height: 120px; align-items: flex-end; background: var(--spark-bg); border: 1px solid var(--line); padding: 8px; overflow: hidden; border-radius: var(--radius-sm); }
.stream-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-width: 4px; }
.stream-cell { width: 100%; border-radius: 2px; transition: height 0.45s cubic-bezier(0.4,0,0.2,1); }
.stream-cell.hit { background: var(--c-green); box-shadow: 0 0 6px var(--c-green); }
.stream-cell.miss { background: var(--c-red); box-shadow: 0 0 6px var(--c-red); }
.stream-rise-new { animation: stream-rise 0.5s ease; }
@keyframes stream-rise { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
.stream-legend { display: flex; gap: 18px; margin-top: 11px; font-size: 0.72rem; color: var(--muted); align-items: center; }
.stream-legend .lg { display: flex; align-items: center; gap: 7px; }
.stream-legend .lg::before { content: ""; width: 8px; height: 8px; border-radius: 2px; }
.stream-legend .lg.hit::before { background: var(--c-green); box-shadow: 0 0 5px var(--c-green); }
.stream-legend .lg.miss::before { background: var(--c-red); box-shadow: 0 0 5px var(--c-red); }

/* FAB */
.fab {
  position: fixed; bottom: 24px; right: 24px; z-index: 50;
  background: var(--fab-bg); color: var(--phosphor-bright);
  border: 1px solid var(--line-strong); width: 58px; height: 58px; border-radius: 50%;
  cursor: pointer; font-family: var(--font-mono); font-weight: 700; font-size: 0.72rem;
  -webkit-backdrop-filter: blur(var(--blur));
  backdrop-filter: blur(var(--blur));
  box-shadow: var(--shadow-lg); transition: all var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.fab svg { width: 21px; height: 21px; }
.fab:hover { background: var(--glass-hover); transform: translateY(-3px); box-shadow: var(--glow), var(--shadow-lg); }
.fab:active { transform: translateY(0); }
.fab .pulse { display: none; }
.fab.refreshing { animation: spin 0.9s linear infinite; }

/* matrix rain canvas (dark ambient, subtle) */
#matrix-rain { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
:root[data-theme="dark"] #matrix-rain { opacity: 0.05; }
:root[data-theme="light"] #matrix-rain { display: none; }

/* ── responsive ───────────────────────────────────────────── */
@media (max-width: 1024px) {
  .grid > * { grid-column: 1 / -1 !important; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 12px; }
  .navbar { flex-wrap: wrap; border-radius: var(--radius); }
  .tiles { grid-template-columns: 1fr; }
  .tiles.tiles-2 { grid-template-columns: 1fr; }
  .donut-row, .gauge-row { flex-direction: column; align-items: stretch; }
  .donut { align-self: center; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .platter .spin, .fab.refreshing { animation: none !important; }
  #matrix-rain { display: none !important; }
  .card:hover, .kpi:hover, .glass-hover:hover, .btn:hover { transform: none; }
}
</style>
</head>

<div class="wrap">

        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </nav>


  <!-- ══════════════ DASHBOARD ══════════════ -->
  <div id="view-dashboard">

      </div>

    <div id="kpis" class="kpi-row"></div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="system" data-title="System" data-sub="host · kernel · memory · cpu" role="tab" type="button">system</button>
      <button class="tab" data-tab="pools" data-title="Pools" data-sub="zfs capacity · fragmentation · vdevs" role="tab" type="button">pools</button>
      <button class="tab" data-tab="arc" data-title="ARC Cache" data-sub="adaptive replacement cache · live stream" role="tab" type="button">arc cache</button>

    <section id="pane-system" class="pane active">

      </div>

    <section id="pane-arc" class="pane">
      <div class="card stream-card" data-accent="arc" id="arc-stream">
        <div class="card-head">
          <span class="card-title">live traffic</span>
          <span class="badge b-online" id="arc-stream-badge">— hit</span>

          <span class="lg hit">hits / interval</span>

        </div>
      </div>
      <div id="arc-grid" class="grid"></div>
      <div id="arc-state" class="state">
        <div class="spinner"></div>
        <div>reading arc kstat…</div>
      </div>
    </section>
  </div>
</div>

<button class="fab" id="fab" onclick="refreshAll()" aria-label="Refresh now" title="Refresh now">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
</button>

<script>
  /* ── theme switcher (light default, dark ambient) ────────── */
  const THEME_KEY = 'zdash-theme';
  const ICON_SUN = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
  const ICON_MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  const ICONS = {
    database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
    pieChart: '<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
    activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
    alertTriangle: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    server: '<rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>',
    layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
    hardDrive: '<line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/>',
    thermometer: '<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>',
    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'
  };
  function iconSVG(name) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
  }
  const root = document.documentElement;
  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    const icon = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (icon) icon.innerHTML = theme === 'dark' ? ICON_SUN : ICON_MOON;
    if (label) label.textContent = theme === 'dark' ? 'light' : 'dark';
  }
  function isLight() { return root.getAttribute('data-theme') !== 'dark'; }
  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) { /* ignore */ }
    applyTheme(saved === 'dark' ? 'dark' : 'light');
  })();
  let lastRefresh = 0;
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
        if (Date.now() - lastRefresh > 800) refreshAll();
      });
    }
  });

  /* ── matrix rain (dark theme ambient, subtle) ────────────── */
  const matrixCanvas = document.getElementById('matrix-rain');
  let matrixRAF = null;
  function startMatrixRain() {
    if (!matrixCanvas) return;
    const ctx = matrixCanvas.getContext('2d');
    const resize = () => {
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener('resize', resize);
    const glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEFｱｲｳｴｵｶｷｸ<>/\\|*=$#@';
    const fontSize = 14;
    let columns = Math.floor(matrixCanvas.width / fontSize);
    let drops = new Array(columns).fill(1).map(() => Math.random() * -matrixCanvas.height);
    function draw() {
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
      ctx.fillStyle = '#38bdf8';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const ch = glyphs[Math.floor(Math.random() * glyphs.length)];
        ctx.fillText(ch, i * fontSize, drops[i]);
        drops[i] += fontSize;
        if (drops[i] > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
      }
    }
    function loop() {
      if (root.getAttribute('data-theme') !== 'dark') { matrixRAF = null; return; }
      draw();
      matrixRAF = requestAnimationFrame(loop);
    }
    if (matrixRAF) cancelAnimationFrame(matrixRAF);
    loop();
  }
  document.addEventListener('DOMContentLoaded', () => {
    if (root.getAttribute('data-theme') === 'dark' &&
      !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      startMatrixRain();
    }
    const btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.addEventListener('click', () => {
        if (root.getAttribute('data-theme') === 'dark' && !matrixRAF &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          startMatrixRain();

  const REFRESH_MS = 5000;
  let timer = null;
  let activeTab = 'system';
  const caps = { zfs: true, arc: true, smart: false };
  const state = { latest: { sys: null, pools: null, arc: null, smart: null } };
  const hitHistory = [];

  let prevHits = null, prevMisses = null;

  let streamScaleRef = 1;     // smoothed max for stable bar heights

  /* ── capability-driven tab suppression ──────────────────── */
  function applyCaps(c) {
    caps.zfs = !!(c && c.zfs_available);
    caps.arc = !!(c && c.arc_available);
    const poolTab = document.querySelector('.tab[data-tab="pools"]');
    const arcTab = document.querySelector('.tab[data-tab="arc"]');
    const poolPane = document.getElementById('pane-pools');
    const arcPane = document.getElementById('pane-arc');
    if (poolTab) poolTab.hidden = !caps.zfs;
    if (arcTab) arcTab.hidden = !caps.arc;
    if (poolPane) poolPane.hidden = !caps.zfs;
    if (arcPane) arcPane.hidden = !caps.arc;
    if ((!caps.zfs && activeTab === 'pools') ||
        (!caps.arc && activeTab === 'arc')) {
      document.querySelector('.tab[data-tab="system"]').click();
    }
  }

  /* ── helpers ─────────────────────────────────────────────── */
  function healthBadge(state) {
    const s = (state || '').toUpperCase();
    if (s === 'ONLINE') return 'b-online';
    if (s === 'DEGRADED' || s === 'SUSPENDED') return 'b-degraded';
    if (s === 'OFFLINE' || s === 'FAULTED' || s === 'REMOVED' || s === 'UNAVAIL') return 'b-offline';
    return 'b-neutral';
  }

  function fmtBytes(b) {
    if (b == null || isNaN(b)) return '—';
    const u = ['B','KiB','MiB','GiB','TiB','PiB','EiB'];
    let i = 0, v = Number(b);
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return v.toFixed(v < 10 && i > 0 ? 2 : 1) + ' ' + u[i];
  }

  function fmtNum(n) {
    if (n == null || isNaN(n)) return '—';
    if (n < 1000) return String(n);
    if (n < 1e6) return (n/1e3).toFixed(1) + 'K';
    if (n < 1e9) return (n/1e6).toFixed(2) + 'M';
    if (n < 1e12) return (n/1e9).toFixed(2) + 'B';
    return (n/1e12).toFixed(2) + 'T';
  }

  function pct(n, d) { return d ? Math.min((n / d) * 100, 100) : 0; }

  /* error state markup: alert icon + message + detail */
  function stateErr(msg, detail) {
    return `<div class="state-err">
      ${iconSVG('alertTriangle')}
      <div class="err">${escapeHTML(msg)}</div>
      ${detail ? `<div class="err-detail">${escapeHTML(detail)}</div>` : ''}
    </div>`;
  }

  function escapeHTML(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* donut: returns SVG markup for a glass donut */
  function donutSVG(segments, size = 132, stroke = 14) {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const cx = size / 2;
    let offset = 0;
    let paths = '';
    for (const seg of segments) {
      if (seg.value <= 0) continue;
      const len = (seg.value / 100) * c;
      paths += `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none"
        stroke-width="${stroke}"
        style="stroke:${seg.color}"
        stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-offset}"
        stroke-linecap="butt"/>`;
      offset += len;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
  }

  function sparkline(data, color, height = 54) {
    if (!data.length) return '<svg viewBox="0 0 100 ' + height + '"></svg>';
    const max = Math.max(...data, 1);
    const min = Math.min(...data, 0);
    const range = max - min || 1;
    const w = 100;
    const step = data.length > 1 ? w / (data.length - 1) : w;
    const pts = data.map((v, i) => {
      const x = i * step;
      const y = height - ((v - min) / range) * (height - 8) - 4;
      return `${x.toFixed(2)},${y.toFixed(2)}`;
    }).join(' ');
    const areaPts = `0,${height} ${pts} ${w},${height}`;
    const gid = 'g' + Math.random().toString(36).slice(2, 8);
    return `
      <svg viewBox="0 0 100 ${height}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" style="stop-color:${color};stop-opacity:0.4"/>
            <stop offset="100%" style="stop-color:${color};stop-opacity:0"/>
          </linearGradient>
        </defs>
        <polygon points="${areaPts}" fill="url(#${gid})"/>
        <polyline points="${pts}" fill="none" style="stroke:${color};stroke-width:1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>`;
  }

  /* colors used across generated markup (theme-token based) */
  const C = {
    green: 'var(--c-green)',
    red: 'var(--c-red)',
    amber: 'var(--c-amber)',
    amberSoft: 'var(--c-amber-soft)',
    cyan: 'var(--c-cyan)',
    purple: 'var(--c-purple)'
  };

  /* ── tab switching (event delegation so dynamic SMART tabs work) ── */
  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = tabId;
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    const pane = document.getElementById('pane-' + tabId);
    if (pane) pane.classList.add('active');
    const titleEl = document.getElementById('page-title');
    const subEl = document.getElementById('page-sub');
    if (titleEl) titleEl.textContent = btn.dataset.title || tabId;
    if (subEl) subEl.textContent = btn.dataset.sub || '';
    renderKPIs();
  }

  document.querySelector('.tabs').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.tab');
    if (!btn || btn.hidden) return;
    switchTab(btn.dataset.tab, btn);

  /* ── KPI summary strip (per-tab, driven by cached latest data) ── */
  function renderKPIs() {
    const el = document.getElementById('kpis');
    if (!el) return;
    const kpis = [];
    const group = (activeTab || 'system').split('-')[0];
    const { sys, pools, arc, smart } = state.latest;

    if (group === 'system' && sys) {
      kpis.push({
        icon: 'clock', accent: 'pool', label: 'uptime', txt: true,
        value: escapeHTML(sys.uptime || '—'),
        sub: sys.boot_time ? 'since ' + new Date(sys.boot_time * 1000).toLocaleDateString() : 'boot time unknown'
      });
      kpis.push({
        icon: 'layers', accent: 'pool', label: 'processes',
        value: sys.processes ? sys.processes.toLocaleString() : '—',
        sub: sys.machine || '—'
      });
      kpis.push({
        icon: 'globe', accent: 'info', label: 'network', txt: true,
        value: escapeHTML(sys.net_ipv4 || sys.net_iface || '—'),
        sub: sys.net_ipv4 && sys.net_iface ? sys.net_iface : (sys.hostname || '—')
      });
    }

    if (group === 'pools' && pools && pools.pools) {
      const entries = Object.entries(pools.pools);
      let online = 0, capSum = 0, capN = 0, worstFrag = -1, worstName = '—', degraded = 0;
      for (const [name, p] of entries) {
        if ((p.state || '').toUpperCase() === 'ONLINE') online++; else degraded++;
        const cap = parseFloat(p.properties?.capacity?.value) || 0;
        capSum += cap; capN++;
        const frag = parseFloat(p.properties?.fragmentation?.value) || 0;
        if (frag > worstFrag) { worstFrag = frag; worstName = name; }
      }
      const avgCap = capN ? (capSum / capN) : 0;
      kpis.push({ icon: 'database', accent: 'pool', label: 'pool count', value: entries.length || '—', sub: online + ' online' });
      kpis.push({
        icon: 'pieChart', label: 'avg capacity', value: entries.length ? avgCap.toFixed(1) + '%' : '—',
        sub: 'across all pools', bar: avgCap,
        accent: avgCap > 90 ? 'err' : avgCap > 75 ? 'warn' : 'pool'
      });
      kpis.push({
        icon: 'activity', label: 'worst frag', value: worstFrag >= 0 ? worstFrag.toFixed(0) + '%' : '—',
        sub: worstName, bar: Math.max(worstFrag, 0),
        accent: worstFrag > 50 ? 'warn' : 'ok'
      });
      kpis.push({
        icon: 'shield', label: 'health', value: degraded ? degraded + ' degraded' : 'All OK',
        sub: online + ' pools online',
        accent: degraded ? 'err' : 'ok'
      });
    }

    if (group === 'arc' && arc) {
      const total = arc.hits + arc.misses;
      const hitPct = total ? (arc.hits / total * 100) : 0;
      kpis.push({
        icon: 'zap', label: 'hit ratio', value: hitPct.toFixed(2) + '%',
        sub: fmtNum(arc.hits) + ' hits', bar: hitPct,
        accent: hitPct > 70 ? 'ok' : hitPct > 40 ? 'warn' : 'err'
      });
      kpis.push({ icon: 'alertTriangle', accent: 'err', label: 'misses', value: fmtNum(arc.misses), sub: 'since module load' });
      kpis.push({
        icon: 'server', accent: 'info', label: 'arc size', value: fmtBytes(arc.size),
        sub: 'of ' + fmtBytes(arc.c_max) + ' max', bar: arc.c_max ? pct(arc.size, arc.c_max) : 0
      });
      kpis.push({ icon: 'database', accent: 'violet', label: 'target size', value: fmtBytes(arc.c), sub: 'min ' + fmtBytes(arc.c_min) });
      kpis.push({ icon: 'layers', accent: 'pool', label: 'evicted', value: fmtNum(arc.deleted), sub: 'blocks since load' });
    }

    if (group === 'smart' && smart && smart.devices && smart.devices.length) {
      const devs = smart.devices;
      const probed = devs.filter(d => d.details);
      const passed = probed.filter(d => d.details.smart_passed).length;
      const unhealthy = probed.filter(d => healthClassForSmart(d.details) !== 'b-online').length;
      const temps = probed.map(d => d.details.temperature_current).filter(t => t > 0);
      const avgTemp = temps.length ? temps.reduce((a, b) => a + b, 0) / temps.length : null;
      let oldestPoh = 0, oldestName = '—';
      for (const d of probed) {
        if (d.details.power_on_hours > oldestPoh) { oldestPoh = d.details.power_on_hours; oldestName = d.name; }
      }
      kpis.push({ icon: 'hardDrive', accent: 'pool', label: 'drives', value: devs.length, sub: passed + ' passed SMART' });
      kpis.push({
        icon: 'shield', label: 'health', value: unhealthy ? unhealthy + ' warning' : 'All healthy',
        sub: probed.length + ' probed',
        accent: unhealthy ? 'err' : 'ok'
      });
      kpis.push({
        icon: 'thermometer', label: 'avg temp', value: avgTemp != null ? avgTemp.toFixed(1) + '°C' : '—',
        sub: temps.length + ' drives reporting', bar: avgTemp != null ? Math.min(avgTemp, 100) : null,
        accent: avgTemp == null ? 'pool' : avgTemp >= 60 ? 'err' : avgTemp >= 45 ? 'warn' : 'ok'
      });
      kpis.push({
        icon: 'clock', accent: 'pool', label: 'oldest POH', value: oldestPoh ? fmtNum(oldestPoh) + ' h' : '—',
        sub: oldestName
      });
    }

    el.innerHTML = kpis.map(k => `
      <div class="kpi" data-accent="${k.accent}">
        <div class="kpi-head"><span class="kpi-icon">${iconSVG(k.icon)}</span><span class="kpi-label">${k.label}</span></div>
        <div class="kpi-value${k.txt ? ' txt' : ''}">${k.value}</div>
        <div class="kpi-sub">${k.sub}</div>
        ${k.bar != null ? `<div class="kpi-bar" style="width:${Math.min(k.bar, 100).toFixed(1)}%"></div>` : ''}
      </div>`).join('');
  }

  const OS_LOGO_ALIASES = {
    arch: 'archlinux', artix: 'archlinux', archarm: 'archlinux', cachyos: 'archlinux',
    pop: 'popos', 'pop-os': 'popos', pop_os: 'popos', void: 'voidlinux', mint: 'linuxmint',
    rhel: 'redhat', rocky: 'rockylinux', kali: 'kalilinux', alpine: 'alpinelinux',
    suse: 'opensuse', sles: 'opensuse', 'opensuse-leap': 'opensuse',
    'opensuse-tumbleweed': 'opensuse', microos: 'opensuse',
    endeavour: 'endeavouros', guix: 'linux'
  };
  function osLogoKey(osId) {
    const id = (osId || '').toLowerCase();
    if (OS_LOGOS[id]) return id;
    if (OS_LOGO_ALIASES[id]) return OS_LOGO_ALIASES[id];
    if (id.startsWith('opensuse') || id.startsWith('suse')) return 'opensuse';
    if (id.startsWith('arch')) return 'archlinux';
    if (id.startsWith('pop')) return 'popos';
    return 'linux';
  }
  function osLogoSVG(osId) {
    const key = osLogoKey(osId);
    const [color, d] = OS_LOGOS[key];
    return `<svg class="distro-logo" viewBox="0 0 24 24" role="img" aria-label="${escapeHTML(key)}"><path fill="${color}" d="${d}"/></svg>`;
  }

  function ffRow(key, valHtml) {
    return `<div class="ff-row"><span class="ff-key">${key}</span><span class="ff-sep">:</span><span class="ff-val">${valHtml}</span></div>`;
  }

  function renderSys(s) {
    const grid = document.getElementById('sys-grid');
    const stateEl = document.getElementById('sys-state');
    stateEl.innerHTML = '';
    if (!s) { grid.innerHTML = ''; return; }

    const osLabel = s.os || s.os_id || (s.kernel || 'unknown');
    const kernelFull = [s.kernel, s.kernel_release].filter(Boolean).join(' ');
    const memUsedPct = s.memory_total_bytes
      ? (s.memory_used_bytes / s.memory_total_bytes * 100) : 0;
    const memCachedPct = s.memory_total_bytes
      ? (s.memory_cached_bytes / s.memory_total_bytes * 100) : 0;
    const memFreePct = Math.max(100 - memUsedPct - memCachedPct, 0);
    const memColor = memUsedPct > 90 ? C.red : memUsedPct > 75 ? C.amber : C.amberSoft;
    const memBadge = memUsedPct > 90 ? 'b-offline' : memUsedPct > 75 ? 'b-degraded' : 'b-online';
    const loadStr = (s.load1 != null)
      ? `${s.load1.toFixed(2)} ${s.load5.toFixed(2)} ${s.load15.toFixed(2)}`
      : '—';
    const swapStr = s.swap_total_bytes
      ? `${fmtBytes(s.swap_total_bytes - s.swap_free_bytes)} / ${fmtBytes(s.swap_total_bytes)}`
      : 'disabled';
    const hostStr = [s.host_vendor, s.host_product].filter(Boolean).join(' ') || '—';
    const freqStr = s.cpu_freq_mhz
      ? `${s.cpu_freq_mhz.toFixed(0)} MHz` +
        (s.cpu_max_mhz ? ` / ${s.cpu_max_mhz.toFixed(0)} MHz` : '')
      : '—';
    const coresStr = s.cpu_physical_cores && s.cpu_physical_cores !== s.cpu_cores
      ? `${s.cpu_physical_cores}P / ${s.cpu_cores || 0}L`
      : `${s.cpu_cores || 0}`;
    const netStr = s.net_iface
      ? `${escapeHTML(s.net_iface)}${s.net_ipv4 ? ` · ${escapeHTML(s.net_ipv4)}` : ''}`
      : '—';
    const osFull = escapeHTML(osLabel);

    const dashUp = document.getElementById('dash-uptime');
    if (dashUp) dashUp.textContent = (s.uptime || '—') + ' uptime';

    const brandHostEl = document.getElementById('brand-host');
    if (brandHostEl) {
      brandHostEl.textContent = s.fqdn ? `@${s.fqdn}` : `@${s.hostname || 'host'}`;
    }

    /* Identity (left) and runtime (right) key/value columns of the host card. */
    const idRows = [
      ffRow('OS', osFull),
      ffRow('Host', escapeHTML(s.hostname || '—')),
      ffRow('Hardware', escapeHTML(hostStr)),
      ffRow('Machine', escapeHTML(s.machine || '—')),
      ffRow('Network', netStr),
    ];
    const rtRows = [
      ffRow('Kernel', escapeHTML(kernelFull || '—')),
      ffRow('Kernel ver', escapeHTML(s.kernel_version || '—')),
      ffRow('Uptime', escapeHTML(s.uptime || '—')),
      ffRow('Procs', s.processes ? s.processes.toLocaleString() : '—'),
      ffRow('CPU', `${escapeHTML(s.cpu_model || '—')} <span class="ff-sep">·</span> ${coresStr} cores`),
      ffRow('Memory',
        `${fmtBytes(s.memory_used_bytes)} / ${fmtBytes(s.memory_total_bytes)}` +
        (s.memory_total_bytes
          ? ` <span class="ff-bar bar"><span class="bar-fill" style="width:${Math.min(memUsedPct,100).toFixed(1)}%;background:linear-gradient(90deg,${memColor},var(--c-amber-soft))"></span></span>`
          : '')),
    ];

    grid.innerHTML = `
      <div class="card col-7">
        <div class="host-card-head">
          <div class="fastfetch-logo">${osLogoSVG(s.os_id)}</div>
          <div class="host-head-text">
            <div class="host-name">${escapeHTML(s.hostname || 'host')}</div>
            <div class="host-os">${osFull} <span class="ff-sep">·</span> ${escapeHTML(kernelFull || s.kernel_release || '—')}</div>
          </div>
        </div>
        <div class="ff-cols kv-list">
          <div class="ff-col">${idRows.join('')}</div>
          <div class="ff-col">${rtRows.join('')}</div>
        </div>
      </div>

      <div class="card col-5">
        <div class="card-head"><span class="card-title">Uptime</span>
          <span class="badge ${s.uptime_seconds > 0 ? 'b-online' : 'b-offline'}">live</span></div>
        <div class="uptime-hero">${escapeHTML(s.uptime || '—')}</div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Since</div><div class="tile-value violet">${s.boot_time ? new Date(s.boot_time * 1000).toLocaleDateString() : '—'}</div></div>
          <div class="tile"><div class="tile-label">Procs</div><div class="tile-value mint">${s.processes ? s.processes.toLocaleString() : '—'}</div></div>
          <div class="tile"><div class="tile-label">Network</div><div class="tile-value cyan" style="font-size:0.8rem">${netStr}</div></div>
        </div>
      </div>

      <div class="card col-6" data-accent="arc">
        <div class="card-head"><span class="card-title">Memory</span>
          <span class="badge ${memBadge}">${memUsedPct.toFixed(0)}%</span>
        </div>
        <div class="donut-row">
          <div class="donut">
            ${donutSVG([
              { value: memUsedPct, color: C.amberSoft },
              { value: memCachedPct, color: C.cyan },
              { value: memFreePct, color: 'var(--bar-bg)' }
            ])}
            <div class="donut-center">
              <div class="donut-pct" style="color:${memColor}">${memUsedPct.toFixed(0)}%</div>
              <div class="donut-label">used</div>
            </div>
          </div>
          <div class="legend">
            <div class="leg-item"><span class="leg-dot" style="background:${C.amberSoft}"></span>Used<span class="leg-val">${fmtBytes(s.memory_used_bytes)}</span></div>
            <div class="leg-item"><span class="leg-dot" style="background:${C.cyan}"></span>Cached<span class="leg-val">${fmtBytes(s.memory_cached_bytes)}</span></div>
            <div class="leg-item"><span class="leg-dot" style="background:var(--bar-bg)"></span>Free<span class="leg-val">${fmtBytes(s.memory_available_bytes)}</span></div>
            <div class="leg-item"><span class="leg-dot" style="background:${C.purple}"></span>Total<span class="leg-val">${fmtBytes(s.memory_total_bytes)}</span></div>
          </div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>Used</span><span>${memUsedPct.toFixed(1)}%</span></div>
          <div class="bar"><div class="bar-fill" style="width:${Math.min(memUsedPct,100).toFixed(1)}%;background:linear-gradient(90deg,${memColor},var(--c-amber-soft))"></div></div>
        </div>
        <div class="muted-note">swap ${escapeHTML(swapStr)}</div>
      </div>

      <div class="card col-6" data-accent="arc">
        <div class="card-head"><span class="card-title">CPU</span>
          <span class="badge b-online">${coresStr} cores</span></div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Model</div><div class="tile-value cyan" style="font-size:0.8rem">${escapeHTML(s.cpu_model || '—')}</div></div>
          <div class="tile"><div class="tile-label">Vendor</div><div class="tile-value violet">${escapeHTML(s.cpu_vendor || '—')}</div></div>
          <div class="tile"><div class="tile-label">Arch</div><div class="tile-value violet">${escapeHTML(s.machine || '—')}</div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>Load avg (1 / 5 / 15 min)</span><span>${escapeHTML(loadStr)}</span></div>
          <div class="bar"><div class="bar-fill" style="width:${s.cpu_cores ? Math.min(s.load1 / s.cpu_cores * 100, 100) : 0}%;background:linear-gradient(90deg,${C.green},${C.cyan})"></div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>Frequency (cur / max)</span><span>${escapeHTML(freqStr)}</span></div>
          <div class="bar"><div class="bar-fill" style="width:${s.cpu_max_mhz ? Math.min(s.cpu_freq_mhz / s.cpu_max_mhz * 100, 100) : 0}%;background:linear-gradient(90deg,${C.cyan},${C.amberSoft})"></div></div>
        </div>
        <div class="muted-note">${escapeHTML(s.kernel || '')} ${escapeHTML(s.kernel_release || '')}</div>
      </div>`;
  }

  async function fetchSysInfo() {
    try {
      const res = await fetch('/api/sysinfo');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      state.latest.sys = data;
      applyCaps(data);
      renderSys(data);
      return data;
    } catch (err) {
      state.latest.sys = null;
      const el = document.getElementById('sys-state');
      document.getElementById('sys-grid').innerHTML = '';
      el.innerHTML = stateErr('failed to load system data', err.message);
      return null;
    }
  }

  /* ── Pool rendering with spinning platters ───────────────── */
  function renderVdevs(vdevs, depth = 0) {
    if (!vdevs) return '';
    let html = '';
    for (const [name, v] of Object.entries(vdevs)) {
      const indent = Math.min(depth, 3) * 16;
      const hc = healthBadge(v.state);
      const size = v.properties?.size?.value || '—';
      const path = v.path || 'N/A';
      const type = v.vdev_type || 'vdev';
      html += `
        <div class="vdev" style="margin-left:${indent}px">
          <span class="vdev-name">${escapeHTML(name)}</span>
          <div class="vdev-info">
            <span class="type-chip">${escapeHTML(type)}</span>
            <span class="badge ${hc}">${escapeHTML(v.state)}</span>
            <span>${escapeHTML(size)}</span>
            <span style="font-size:0.66rem;opacity:0.65">${escapeHTML(path)}</span>
          </div>
        </div>`;
      if (v.vdevs) html += renderVdevs(v.vdevs, depth + 1);
    }
    return html;
  }

  function renderPool(name, pool) {
    const props = pool.properties || {};
    const cap = parseFloat(props.capacity?.value) || 0;
    const frag = props.fragmentation?.value || '—';
    const dedup = props.dedupratio?.value || '—';
    const hc = healthBadge(pool.state);
    const capColor = cap > 90 ? C.red : cap > 75 ? C.amber : C.amberSoft;
    const fillGrad = cap > 90
      ? `linear-gradient(90deg,${C.red},${C.purple})`
      : cap > 75
        ? `linear-gradient(90deg,${C.amber},${C.red})`
        : `linear-gradient(90deg,${C.amberSoft},${C.cyan})`;

    return `
      <div class="card col-6" data-accent="pool">
        <div class="card-head">
          <span class="card-title">${escapeHTML(name)}</span>
          <span class="head-badges">
            <span class="badge b-neutral">${escapeHTML(pool.type || '—')}</span>
            <span class="badge ${hc}">${escapeHTML(pool.state)}</span>
          </span>
        </div>
        <div class="gauge-row">
          <div class="donut">
            ${donutSVG([
              { value: cap, color: capColor },
              { value: Math.max(100 - cap, 0), color: 'var(--bar-bg)' }
            ])}
            <div class="donut-center">
              <div class="donut-pct" style="color:${capColor}">${cap.toFixed(1)}%</div>
              <div class="donut-label">used</div>
            </div>
          </div>
          <div class="legend">
            <div class="leg-item"><span class="leg-dot" style="background:${C.amberSoft}"></span>Total<span class="leg-val">${escapeHTML(props.size?.value || '—')}</span></div>
            <div class="leg-item"><span class="leg-dot" style="background:${capColor}"></span>Allocated<span class="leg-val">${escapeHTML(props.allocated?.value || '—')}</span></div>
            <div class="leg-item"><span class="leg-dot" style="background:${C.cyan}"></span>Free<span class="leg-val">${escapeHTML(props.free?.value || '—')}</span></div>
          </div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>capacity</span><span>${cap.toFixed(2)}%</span></div>
          <div class="bar"><div class="bar-fill" style="width:${Math.min(cap,100)}%;background:${fillGrad}"></div></div>
        </div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Fragmentation</div><div class="tile-value ${parseFloat(frag) > 50 ? 'amber' : 'mint'}">${escapeHTML(frag)}</div></div>
          <div class="tile"><div class="tile-label">Dedup</div><div class="tile-value cyan">${escapeHTML(dedup)}</div></div>

  /* ── ARC rendering + live stream ─────────────────────────── */
  function pushStreamBucket(arc) {
    const h = Number(arc.hits) || 0;
    const m = Number(arc.misses) || 0;
    // Counters only ever increase; a decrease means the module reloaded,
    // so reset the baseline without emitting a bogus delta bucket.
    const dh = prevHits === null || h < prevHits ? 0 : h - prevHits;
    const dm = prevMisses === null || m < prevMisses ? 0 : m - prevMisses;
    prevHits = h;
    prevMisses = m;
    streamBuckets.push({ h: dh, m: dm });
    if (streamBuckets.length > STREAM_LEN) streamBuckets.shift();
  }

  function initStream() {
    const el = document.getElementById('arc-stream');
    if (!el) return;
    const stream = el.querySelector('.stream');
    if (!stream) return;
    let cols = '';
    for (let i = 0; i < STREAM_LEN; i++) {
      cols += `<div class="stream-col">
        <div class="stream-cell miss"></div>
        <div class="stream-cell hit"></div>
      </div>`;
    }
    stream.innerHTML = cols;
    streamCols = Array.from(stream.children);
  }

  function renderStream(hitPct) {
    const card = document.getElementById('arc-stream');
    if (!card || !streamCols) return;
    const badge = document.getElementById('arc-stream-badge');
    if (badge && typeof hitPct === 'number') {
      badge.textContent = (hitPct >= 0 ? hitPct.toFixed(2) : '—') + '% hit';
      badge.className = 'badge ' +
        (hitPct > 70 ? 'b-online' : hitPct > 40 ? 'b-degraded' : 'b-offline');
    }
    const countEl = document.getElementById('arc-stream-count');
    if (countEl) countEl.textContent = streamBuckets.length + ' samples';

    const observed = Math.max(1, ...streamBuckets.map(b => Math.max(b.h, b.m)));
    if (observed > streamScaleRef) {
      streamScaleRef = observed;
    } else {
      streamScaleRef = Math.max(observed, streamScaleRef * 0.92);
    }
    const max = Math.max(1, streamScaleRef);

    const n = streamBuckets.length;
    for (let i = 0; i < STREAM_LEN; i++) {
      const col = streamCols[i];
      const bucketIdx = n - STREAM_LEN + i;
      const b = bucketIdx >= 0 ? streamBuckets[bucketIdx] : null;
      const hit = col.querySelector('.stream-cell.hit');
      const miss = col.querySelector('.stream-cell.miss');
      if (!b) {
        hit.style.height = '0%';
        miss.style.height = '0%';
        continue;
      }
      const hH = (b.h / max) * 100;
      const mH = (b.m / max) * 100;
      hit.style.height = hH.toFixed(2) + '%';
      miss.style.height = mH.toFixed(2) + '%';
      if (i === STREAM_LEN - 1) {
        hit.classList.remove('stream-rise-new');
        miss.classList.remove('stream-rise-new');
        void hit.offsetWidth;
        hit.classList.add('stream-rise-new');
        miss.classList.add('stream-rise-new');
      }
    }
  }

  /* ── SMART drives (dynamic per-drive tabs) ──────────────── */
  const smartTabs = new Map();

  function sanitizeTabId(name) {
    return (name || '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  function deviceLabel(name) {
    return 'SMART ' + (name || '?');
  }

  function healthClassForSmart(details) {
    if (!details) return 'b-offline';
    if (!details.smart_passed) return 'b-offline';
    if (details.nvme && details.nvme.critical_warning > 0) return 'b-degraded';
    if (details.ata) {
      const criticalIds = [5, 197, 198];
      for (const a of details.ata.attributes) {
        if (criticalIds.includes(a.id) && a.raw > 0) return 'b-degraded';
      }
    }
    return 'b-online';
  }

  function tempColor(cur, warn, crit) {
    if (cur == null) return 'var(--text)';
    if (crit && cur >= crit) return 'var(--crimson)';
    if (warn && cur >= warn) return 'var(--amber-warn)';
    return 'var(--mint)';
  }

  function renderNVMeCard(details) {

    const endurancePct = Math.min(n.percentage_used, 100);
    const enduranceColor = endurancePct > 80 ? C.red
      : endurancePct > 60 ? C.amber : C.green;
    const warnFlags = n.critical_warning > 0
      ? `<span class="badge b-degraded">critical warning 0x${n.critical_warning.toString(16)}</span>`
      : `<span class="badge b-online">healthy</span>`;
    return `
      <div class="card col-6" data-accent="pool">
        <div class="card-head"><span class="card-title">NVMe Health</span>${warnFlags}</div>
