  /* ATA attribute table: value/worst/thresh are normalized smartctl values,
     raw is vendor-encoded. Critical IDs (5/197/198) with raw>0 and attrs below
     threshold or flagged when_failed are highlighted. */
  function renderATA(details) {
    const a = details.ata;
    if (!a || !a.attributes || !a.attributes.length) return '';
    const criticalIds = [5, 197, 198];
    const rows = a.attributes.map(attr => {
      const failed = !!attr.when_failed;
      const criticalRaw = criticalIds.includes(attr.id) && attr.raw > 0;
      const belowThresh = attr.thresh > 0 && attr.value <= attr.thresh;
      const nearThresh = attr.thresh > 0 && (attr.value - attr.thresh) <= 10;
      let statusTxt = 'OK', statusCls = 't-ok';
      if (failed) {
        statusTxt = attr.when_failed === 'failing_now' ? 'FAILING NOW' : 'FAILED PAST';
        statusCls = 't-crit';
      } else if (criticalRaw || belowThresh) {
        statusTxt = criticalRaw ? 'CRITICAL RAW' : 'BELOW THRESH';
        statusCls = 't-crit';
      } else if (nearThresh) {
        statusTxt = 'WATCH';
        statusCls = 't-warn';
      }
      const rowCls = statusCls === 't-crit' ? 'row-crit' : statusCls === 't-warn' ? 'row-warn' : '';
      const rawTxt = attr.raw_string || fmtNum(attr.raw);
      return `
        <tr class="${rowCls}">
          <td class="attr-id">${attr.id}</td>
          <td class="attr-name">${escapeHTML(attr.name)}</td>
          <td>${attr.value}</td>
          <td>${attr.worst}</td>
          <td>${attr.thresh}</td>
          <td class="attr-raw">${escapeHTML(rawTxt)}</td>
          <td class="${statusCls}">${statusTxt}</td>
        </tr>`;
    }).join('');
    const st = a.self_test || {};
    const stBadge = st.passed === false
      ? '<span class="badge b-offline">SELF-TEST FAILED</span>'
      : st.passed ? '<span class="badge b-online">SELF-TEST PASSED</span>' : '';
    const stNote = st.status
      ? `last self-test: ${escapeHTML(st.status)}${st.hours ? ' · ' + fmtNum(st.hours) + 'h ago' : ''}`
      : '';
    return `
      <div class="card col-12" data-accent="pool">
        <div class="card-head">
          <span class="card-title">ATA SMART Attributes</span>
          ${stBadge}
        </div>
        ${stNote ? `<div class="muted-note" style="text-align:left;margin:0 0 6px">${stNote}</div>` : ''}
        <div class="table-scroll">
          <table class="smart-table">
            <thead><tr><th>id</th><th>attribute</th><th>value</th><th>worst</th><th>thresh</th><th>raw</th><th>status</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="muted-note">value/worst are normalized (100 = best) · raw values are vendor-encoded</div>
      </div>`;
  }

  function renderSmartPane(dev, paneEl) {
    const d = dev.details;
    if (!d) {
      paneEl.innerHTML = `<div class="state">${stateErr('SMART probe failed', dev.error || 'unknown error')}</div>`;
      return;
    }
    const hc = healthClassForSmart(d);
    const passedBadge = d.smart_passed
      ? `<span class="badge ${hc}">PASSED</span>`
      : `<span class="badge b-offline">FAILED</span>`;
    const isRotating = d.rotation_rate > 0;
    const driveKind = d.protocol === 'NVMe' ? 'NVMe SSD'
      : (isRotating ? `HDD · ${d.rotation_rate} rpm` : 'SATA SSD');
    const tempC = tempColor(d.temperature_current, d.temperature_warning, d.temperature_critical);
    const tempPct = d.temperature_critical
      ? Math.min((d.temperature_current / d.temperature_critical) * 100, 100) : 0;

    paneEl.innerHTML = `
    <div class="grid">
      <div class="card col-12">
        <div class="card-head"><span class="card-title">${escapeHTML(dev.name)} · ${escapeHTML(d.model_name || 'unknown')}</span>${passedBadge}</div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Model</div><div class="tile-value cyan" style="font-size:0.8rem">${escapeHTML(d.model_family || d.model_name || '—')}</div></div>
          <div class="tile"><div class="tile-label">Serial</div><div class="tile-value violet" style="font-size:0.8rem">${escapeHTML(d.serial_number || '—')}</div></div>
          <div class="tile"><div class="tile-label">Firmware</div><div class="tile-value amber">${escapeHTML(d.firmware_version || '—')}</div></div>
          <div class="tile"><div class="tile-label">Capacity</div><div class="tile-value cyan">${fmtBytes(d.capacity_bytes)}</div></div>
          <div class="tile"><div class="tile-label">Kind</div><div class="tile-value violet">${escapeHTML(driveKind)}</div></div>
          <div class="tile"><div class="tile-label">Transport</div><div class="tile-value amber">${escapeHTML(d.protocol || '—')} · ${escapeHTML(d.device_type || '—')}</div></div>
          ${d.form_factor ? `<div class="tile"><div class="tile-label">Form Factor</div><div class="tile-value violet">${escapeHTML(d.form_factor)}</div></div>` : ''}
          <div class="tile"><div class="tile-label">Power-On Hours</div><div class="tile-value mint">${fmtNum(d.power_on_hours)}</div></div>
          <div class="tile"><div class="tile-label">Power Cycles</div><div class="tile-value mint">${fmtNum(d.power_cycle_count)}</div></div>
        </div>
      </div>

      <div class="card col-6" data-accent="arc">
        <div class="card-head"><span class="card-title">Temperature</span>
          <span class="badge ${d.temperature_critical && d.temperature_current >= d.temperature_critical ? 'b-offline' : d.temperature_warning && d.temperature_current >= d.temperature_warning ? 'b-degraded' : 'b-online'}">${d.temperature_current != null ? d.temperature_current + '°C' : '—'}</span>
        </div>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Current</div><div class="tile-value ${d.temperature_critical && d.temperature_current >= d.temperature_critical ? 'crimson' : d.temperature_warning && d.temperature_current >= d.temperature_warning ? 'amber' : 'mint'}" style="font-size:1.3rem">${d.temperature_current != null ? d.temperature_current + '°' : '—'}</div></div>
          <div class="tile"><div class="tile-label">Warn Limit</div><div class="tile-value amber">${d.temperature_warning || '—'}°</div></div>
          <div class="tile"><div class="tile-label">Crit Limit</div><div class="tile-value crimson">${d.temperature_critical || '—'}°</div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-head"><span>current vs critical</span><span>${d.temperature_current != null ? d.temperature_current + '°C' : '—'}</span></div>
          <div class="bar"><div class="bar-fill" style="width:${tempPct}%;background:linear-gradient(90deg,${tempC},${tempC})"></div></div>
        </div>
        <div class="muted-note">color reflects current temperature vs. published limits</div>
      </div>

      ${d.nvme ? renderNVMeCard(d) : ''}

      ${d.ata ? renderATA(d) : ''}

      ${(!d.nvme && !d.ata) ? `
      <div class="card col-12" data-accent="pool">
        <div class="card-head"><span class="card-title">Health Summary</span></div>
        <div class="state" style="padding:30px 10px">no transport-specific health log available for this device</div>
        <div class="muted-note">SCSI/libata devices may not expose SMART attributes</div>
      </div>` : ''}
    </div>`;
  }

  function smartSortKey(dev) {
    const proto = (dev.protocol || (dev.details && dev.details.protocol) || '').toUpperCase();
    const isNvme = proto === 'NVME' || /nvme/i.test(dev.name || '');
    return (isNvme ? '0:' : '1:') + (dev.name || '');
  }

  function setSmartTabMeta(btn, dev) {
    btn.dataset.title = 'SMART ' + (dev.name || '?');
    btn.dataset.sub = dev.details
      ? `${dev.details.model_name || 'unknown model'} · ${fmtBytes(dev.details.capacity_bytes)}`
      : (dev.error || 'probe failed');
    if (activeTab === btn.dataset.tab) {
      const titleEl = document.getElementById('page-title');
      const subEl = document.getElementById('page-sub');
      if (titleEl) titleEl.textContent = btn.dataset.title;
      if (subEl) subEl.textContent = btn.dataset.sub;
    }
  }

  function ensureSmartTab(dev) {
    const id = 'smart-' + sanitizeTabId(dev.name);
    let btn = smartTabs.get(dev.name);
    if (btn) {
      setSmartTabMeta(btn, dev);
      const pane = document.getElementById('pane-' + id);
      if (pane) renderSmartPane(dev, pane);
      return btn;
    }
    btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.tab = id;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('type', 'button');
    const hc = healthClassForSmart(dev.details);
    const dot = dev.details
      ? `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:${hc === 'b-online' ? 'var(--mint)' : hc === 'b-degraded' ? 'var(--amber-warn)' : 'var(--crimson)'};box-shadow:0 0 6px currentColor"></span>`
      : '';
    btn.innerHTML = dot + escapeHTML(deviceLabel(dev.name));
    if (!dev.details) {
      btn.style.opacity = '0.55';
      btn.title = 'SMART probe failed: ' + (dev.error || 'unknown');
    }
    setSmartTabMeta(btn, dev);
    document.querySelector('.tabs').appendChild(btn);
    const pane = document.createElement('section');
    pane.id = 'pane-' + id;
    pane.className = 'pane';
    document.querySelector('.wrap').appendChild(pane);
    renderSmartPane(dev, pane);
    smartTabs.set(dev.name, btn);
    return btn;
  }

  function clearSmartTabs() {
    for (const [name, btn] of smartTabs) {
      if (btn) btn.remove();
      const pane = document.getElementById('pane-' + 'smart-' + sanitizeTabId(name));
      if (pane) pane.remove();
    }
    smartTabs.clear();
    if (activeTab && activeTab.startsWith('smart-')) {
      document.querySelector('.tab[data-tab="system"]').click();
    }
  }

  async function fetchSmart() {
    try {
      const res = await fetch('/api/smart');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      state.latest.smart = data;
      applySmartCap(data);
      if (!caps.smart || !data.devices || data.devices.length === 0) {
        clearSmartTabs();
        return data;
      }
      const sorted = [...data.devices].sort((a, b) => {
        const ka = smartSortKey(a), kb = smartSortKey(b);
        return ka < kb ? -1 : ka > kb ? 1 : 0;
      });
      const seen = new Set();
      for (const dev of sorted) {
        seen.add(dev.name);
        ensureSmartTab(dev);
      }
      const tabsNav = document.querySelector('.tabs');
      for (const dev of sorted) {
        const btn = smartTabs.get(dev.name);
        if (btn) tabsNav.appendChild(btn);
      }
      for (const [name, btn] of [...smartTabs]) {
        if (!seen.has(name)) {
          if (btn) btn.remove();
          const pane = document.getElementById('pane-' + 'smart-' + sanitizeTabId(name));
          if (pane) pane.remove();
          smartTabs.delete(name);
        }
      }
      return data;
    } catch (err) {
      state.latest.smart = null;
      applySmartCap({ smartctl_available: false });
      clearSmartTabs();
      return null;
    }
  }

  function applySmartCap(report) {
    caps.smart = !!(report && report.smartctl_available && report.devices && report.devices.length);
  }

  async function refreshAll() {
    lastRefresh = Date.now();
    const fab = document.getElementById('fab');
    fab.classList.add('refreshing');
    try {
      await fetchSysInfo();
      const tasks = [];
      tasks.push(caps.zfs ? fetchPools() : Promise.resolve(null));
      tasks.push(caps.arc ? fetchARC() : Promise.resolve(null));
      tasks.push(fetchSmart());
      await Promise.all(tasks);
      renderKPIs();
    } finally {
      setTimeout(() => fab.classList.remove('refreshing'), 500);
    }
  }

  initStream();
  refreshAll();
  timer = setInterval(refreshAll, REFRESH_MS);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearInterval(timer); timer = null; }
    else if (!timer) { timer = setInterval(refreshAll, REFRESH_MS); }
  });
</script>
</body>
</html>
